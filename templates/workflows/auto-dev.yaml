# /pipeline auto-dev — Full-auto release pipeline
# Measures release state → drafts and reviews triage mutations → plan → commit mutations → implement → verify → release

name: auto-dev
description: "Full-auto release pipeline with measured release targets and a reviewed mutation barrier"
mode: auto
error: halt-and-report
observability:
  token_spend:
    enabled: true
    state_file: "/tmp/auto-dev-spend-{PPID}.json"
    estimate: "round((input_chars + output_chars) / 4)"
    report_before: followup

steps:
  - name: preflight-sync
    prompt: |
      Phase 0 — Sync local repository and detect stale issue context before triage.

      1. Run `git fetch --all --tags --prune`.
      2. Compute `behind=$(git rev-list --count HEAD..origin/$(git rev-parse --abbrev-ref HEAD))`.
      3. If behind > 0 and the worktree is clean, run `git pull --ff-only` and report synced commits.
      4. If behind > 0 and the worktree is dirty, halt with a manual reconcile message.
      5. Report latest tag, local HEAD, and synced/behind state.
      6. Compare open issue body `vX.Y.Z` references against local git tags and warn on references to missing tags.
      7. Run `node scripts/resolve-release-target.mjs --json` and persist its JSON as the release-target evidence artifact.
         The resolver must fail closed unless it has measured Git tags, public npm, and authenticated GitHub Packages.
         Record `gitLatest`, `npmLatest`, `ghpLatest`, `targetVersion`, measurement time, and source SHA; memory is advisory only.
      8. Read the open issue, label, and milestone inventories without changing them. Include release-monitor queues (`codex-release`, `oh-my-codex-release`) before deciding that no work remains.
    description: Sync remote state, detect stale references, and measure a collision-free release target

  - name: scope-selection
    depends_on: preflight-sync
    prompt: |
      Select one bounded release scope from the read-only inventory and protect against stale milestone reuse.

      Milestone pre-check:
      - Query all milestones, open and closed, for the measured targetVersion.
      - If the target milestone already exists and is closed, halt and require a version bump or manual reopen.
      - If it exists and is open, record it for reuse in the local draft.
      - If it does not exist, record an idempotent milestone.ensure action in the local draft; do not create it here.

      Label semantics:
      - Reference `.codex/skills/pipeline/labels.md`.
      - Exclude blocked_by_decision, decision-needed, needs-review, verify-done, manual-action, and in-progress issues.
      - Prefer verify-ready, codex-release, oh-my-codex-release, claude-code-release, and documentation issues.
      - Sort by P1, P2, P3, then dependency order; cap a release unit at 7 issues.

      Output a read-only release manifest with issue number, title, prerequisite, effort, and labels.
    description: Read-only milestone check, label filter, and bounded release scope selection

  - name: compression-mode-eval
    depends_on: scope-selection
    prompt: |
      Evaluate compression mode.

      Use `compression_mode=docs-only` only when:
      - scope size is 3 or fewer issues
      - every scoped issue has at least one of documentation, automated, codex-release, oh-my-codex-release, claude-code-release, or enhancement-yaml-only

      Use `compression_mode=lite` only when:
      - scope size is 5 or fewer issues
      - every scoped issue is documentation, automated release-monitor, feedback, improvement, enhancement, YAML/config-only, or low-risk rule/skill text
      - no scoped issue requires TypeScript runtime behavior, package dependency changes, migration, or security-sensitive logic

      Gate transparency:
      - Do not add or change labels solely to qualify for docs-only or lite mode.
      - If labels were changed during triage and affect compression eligibility, state that fact in the mode decision.
      - Whenever a skill stage is replaced by integrated analysis, log a concrete justification:
        `[compression-mode] lite — skill stage replaced by integrated analysis; scope={n}; low-risk evidence={issue_refs}`.
      - If the justification cannot be stated concretely, do not compress that stage; run the full skill.

      Cross-tier pre-existing converged artifact substitution:
      - A triage, plan, deep-plan, or deep-verify step may be satisfied by an existing converged research/plan/verification artifact instead of a fresh skill spawn, even in standard mode.
      - The artifact must explicitly cover the scoped issue domain, be current for the release scope, and provide output equivalent to the skipped step.
      - This substitution never applies to implement, verify-build, release, publish, or CI/publish verification.
      - Log the artifact path or URL and why it is equivalent before substituting.

      In docs-only mode, replace heavyweight triage/plan/deep-plan/deep-verify spawns with direct summaries plus local self-review.
      In lite mode, keep a concise implementation plan and local self-review, but still run verify-build.
      In lite mode deep-verify, if the change set has no structural surface (for example workflow-YAML/docs-only with no agent/skill/guide/rule frontmatter changes), the R017/deep-verify spawn may be skipped and replaced by deterministic self-checks: template parity, multi-copy checksum, YAML parse, and the normal verify-build gate. Log:
        `[compression-mode] lite deep-verify — R017 spawn skipped (no structural surface); deterministic self-check only`.
      Otherwise use standard mode.
      Output the selected compression_mode for downstream steps.
    description: Evaluate docs-only compression eligibility

  - name: triage-draft
    depends_on: compression-mode-eval
    prompt: |
      Build a read-only triage draft from the measured release target, issue inventory, and repository evidence.

      - Use native repository exploration and local synthesis; do not execute a mutating triage skill.
      - Join each proposed action to direct issue, milestone, label, and code evidence.
      - Preserve the issue's existing priority unless direct evidence justifies a reviewed change.
      - Write a schemaVersion 1 JSON artifact with `evidenceJoined: true`, repository identity, and timestamped evidenceSources (`id`, `kind`, `source`, `observedAt`).
      - Give every action a stable id, rationale, and non-empty evidenceRefs that resolve to those sources; only `issue.update`, `label.ensure`, and `milestone.ensure` require a `desired` snapshot.
      - Include idempotent label.ensure, milestone.ensure, issue.update, or issue.comment actions only when evidence supports them.
      - Comment actions use a regular non-symlink body file with the exact standalone marker `<!-- triage-action:<action-id> -->`, a complete issue precondition, positive `bodyBytes`, and lowercase `bodySha256` computed from the exact reviewed bytes.
      - When a comment and issue update share one observed issue snapshot, order the comment before the update. Otherwise bind each later issue action precondition to the preceding desired state; the apply script validates the full sequence before its first write.
      - Do not set `reviewed: true`; that field belongs to evidence-review.
      - This step performs zero GitHub mutations.
    description: Produce a local evidence-joined mutation draft without changing GitHub

  - name: plan
    depends_on: triage-draft
    skill: release-plan
    description: Group the read-only triage draft into a release unit; skipped if compression_mode=docs-only
    input: triage-draft

  - name: deep-plan
    depends_on: plan
    skill: deep-plan
    description: Create detailed implementation plan for each release group; skipped if compression_mode=docs-only
    foreach: release-group

  - name: evidence-review
    depends_on: deep-plan
    prompt: |
      Review the release manifest, implementation plan, and triage draft against direct ground truth.

      - Re-read every referenced issue, label, and milestone and compare it with the draft precondition.
      - Confirm the evidence join covers every proposed mutation and no action is inferred from stale memory.
      - For every comment action, reopen the regular non-symlink body file and confirm its exact bytes still match `bodyBytes`, `bodySha256`, and the standalone marker before authorization.
      - Confirm targetVersion is absent from Git tags, public npm, and authenticated GitHub Packages evidence.
      - Confirm issue priority is preserved and release-note content yields before original issue context when a body needs fitting.
      - If any fact is stale or ambiguous, halt before mutation and regenerate the draft.
      - Reject unknown fields and unresolved evidenceRefs. If all checks pass, write `reviewed: true` and `reviewedAt` into the local artifact and read it back.
    description: Review joined evidence and authorize the local draft, without mutating GitHub

  - name: mutation-commit
    depends_on: evidence-review
    prompt: |
      Cross the mutation barrier exactly once by applying the reviewed local artifact:
      `node scripts/apply-triage-draft.mjs --draft <triage-draft.json> --repo <owner/repo> --json`.

      The script must reject stale preconditions, unknown fields, missing rationale/evidence, and malformed comment markers; skip already-satisfied actions; allow only declared action kinds; and perform direct readback after every write. Halt on any mismatch; do not improvise a replacement mutation command.
    description: Apply only the reviewed mutation draft with idempotency and direct readback

  - name: implement
    depends_on: mutation-commit
    prompt: |
      Execute implementation plan with appropriate agents.

      Codex-native sensitive-path policy:
      - Codex-managed `.codex/` edits use the normal edit/patch flow.
      - Claude Code `bypassPermissions` can write `.claude/skills/`, `.claude/agents/`, and `.claude/commands/` directly on v2.1.121+, with broader protected-path writes available on v2.1.126+.
      - If a port requires `.claude` template parity changes, make the change explicit and verify sensitive-path guard tests.
      - Use `/tmp/{skill}-{timestamp}.md` only as a historical fallback for older Claude Code versions, non-bypass sessions, or runs that still surface a protected-path prompt.
    description: Execute implementation plan with appropriate agents
    foreach: planned-issue

  - name: verify-build
    depends_on: implement
    prompt: |
      Project-specific build + test verification.

      Scope-change re-entry guard:
      - If a scoped issue is added or materially changed after verify-build starts, reset this phase and re-run the full verify-build gate for the new aggregate scope.
      - Do not proceed to release from a verify-build result collected before the latest scoped implementation change.

      Shell execution discipline:
      - Run compound verification commands under `set -euo pipefail` so lint, typecheck, tests, and build halt on the first failed gate.
      - Do not rely on `set -o pipefail` alone for sequential verification chains.
      - Avoid reserved shell variable names in polling or status snippets (`status`, `path`, `argv`); use `run_status`, `cmd_path`, or `args` instead.

      For Node/Bun projects:
      1. Run `bun install` and halt on lockfile drift.
      2. Run `bun run lint` when available.
      3. Run `bun run typecheck` when available.
      4. Run `bun test` mandatorily; do not silently skip tests.
      5. Adopt the prior version's test result as the dynamic baseline. Current Codex baseline is 0 failures after #1328 verification.
      6. Halt if current failures exceed baseline; otherwise report pass/fail counts and delta.
      7. Run `bun run build` when available.

      Documentation/template validation:
      - For local or CI docs validation, run `bun run .github/scripts/validate-docs.ts --programmatic-only` (or the repo's equivalent validate-docs command with `--programmatic-only`) before assuming a validation failure is an authentication failure.
      - Treat interactive/auth-dependent validate-docs output as inconclusive until the programmatic-only path has been tried.

      Halt on lint errors, typecheck errors, new test failures, build failure, or lockfile drift.
    description: Auto-detected build + test verification with mandatory bun test baseline delta guard

  - name: verify
    depends_on: verify-build
    skill: deep-verify
    description: Multi-angle release quality verification; self-review checklist if compression_mode=docs-only, or deterministic self-check in lite mode when no structural surface changed

  - name: release
    depends_on: verify
    prompt: |
      Create release branch and pull request.

      Required version preflight for npm package releases:
      - Re-run `node scripts/resolve-release-target.mjs --expected-target <reviewed-target> --json` immediately before the first version mutation.
      - Determine NEW_VERSION from its targetVersion; do not recompute from memory or a single registry.
      - The resolver always computes stable max + one patch; expected-target is assertion-only. If it mismatches, halt and re-enter evidence review.
      - Require the refreshed source SHA to equal current HEAD.
      - Require targetVersion to remain absent from Git, public npm, and GitHub Packages.
      - Update `package.json` and `templates/manifest.json` to NEW_VERSION in the same commit.
      - Promote `CHANGELOG.md` before the release PR/tag: move non-empty `## [Unreleased]` entries into `## [NEW_VERSION] - YYYY-MM-DD`, then re-create an empty `## [Unreleased]` section above it.
      - If `CHANGELOG.md` has no user/package-visible entry for NEW_VERSION, add a concise release summary before continuing instead of relying on GitHub auto-generated release notes.
      - Use same-directory temporary files for generated JSON writes; do not write through `/tmp`.
      - Run `bash .github/scripts/verify-version-sync.sh` after the bump and before tag or PR creation.
      - Commit the bump and changelog promotion with `chore(release): bump to v{NEW_VERSION}` before any release tag is created.

      Before creating `release/v*`, check whether a local branch named exactly
      `release` exists. Git stores refs as files/directories, so
      `refs/heads/release` blocks `refs/heads/release/vX.Y.Z`.

      Required preflight:
      - `git branch --list release --format='%(refname:short)'`
      - If present, prove it is merged or backed up before renaming/removing it.
      - Prefer `git branch -m release releases-tracking` when preservation is
        needed; do not run `git branch -D release` without explicit approval.
      - Re-run the branch-list check before `git switch -c release/vX.Y.Z`.

      External-write ownership gate:
      - Detect repository-owned tag and release automation before any external write.
      - When automation owns the transition, merge the reviewed release PR and observe the workflow instead of duplicating its writes.
      - Do not create or push tags manually while repository automation owns them.
      - Any manual issue or milestone recovery must use a fresh reviewed local mutation draft, evidence review, `scripts/apply-triage-draft.mjs`, and direct readback.
    description: Create release branch and pull request

  - name: publish
    prompt: |
      Publish the validated release artifact after the release PR/branch stage.

      Detect repository-owned tag and release automation before any external write.
      When automation owns the transition, merge the reviewed release PR and observe the workflow; do not duplicate tag, publication, issue, or milestone writes.

      Project-specific behavior:
      - npm package:
        1. Confirm package name and current version from package.json
        2. Check public npm and authenticated GitHub Packages registry state
        3. If version is unchanged but release-worthy, bump semver intentionally
        4. Prefer the repository's release workflow trigger; publish directly only when the documented contract has no automation owner
        5. Verify publication in both registries, including the expected GitHub Packages version
      - GitHub-release artifact project:
        1. Prove whether repository automation or a documented manual path owns the tag
        2. Observe the automation, or use the documented manual path only when no automation owner exists
        3. Verify the release exists and assets are available

      Do not create or push tags manually while repository automation owns them.
      Any manual issue or milestone recovery must use a fresh reviewed local mutation draft, evidence review, `scripts/apply-triage-draft.mjs`, and direct readback.

      Halt and report on auth, versioning, or publish verification failures.
    description: Publish the release artifact and verify external availability
    depends_on: release

  - name: followup
    skill: post-release-followup
    description: Recommend follow-up actions — user chooses to execute now or register as issues
    depends_on: publish
