# /pipeline auto-dev — Full-auto release pipeline
# Measures release state → drafts and reviews triage mutations → plan → commit mutations → implement → verify → release

name: auto-dev
description: "Full-auto release pipeline with measured release targets and a reviewed mutation barrier"
mode: auto
error: halt-and-report
observability:
  token_spend:
    enabled: true
    state_file: "/tmp/auto-dev-spend-{PPID}.json"
    estimate: "round((input_chars + output_chars) / 4)"
    report_before: followup

steps:
  - name: preflight-sync
    prompt: |
      Phase 0 — Sync local repository and detect stale issue context before triage.

      1. Run `git fetch --all --tags --prune`.
      2. Compute `behind=$(git rev-list --count HEAD..origin/$(git rev-parse --abbrev-ref HEAD))`.
      3. If behind > 0 and the worktree is clean, run `git pull --ff-only` and report synced commits.
      4. If behind > 0 and the worktree is dirty, halt with a manual reconcile message.
      5. Report latest tag, local HEAD, and synced/behind state.
      6. Compare open issue body `vX.Y.Z` references against local git tags and warn on references to missing tags.
      7. Run `node scripts/resolve-release-target.mjs --json` and persist its JSON as the release-target evidence artifact.
         The resolver must fail closed unless it has measured Git tags, public npm, and authenticated GitHub Packages.
         Record `gitLatest`, `npmLatest`, `ghpLatest`, `targetVersion`, measurement time, and source SHA; memory is advisory only.
      8. Read the open issue, label, and milestone inventories without changing them. Include release-monitor queues (`codex-release`, `oh-my-codex-release`) before deciding that no work remains.
    description: Sync remote state, detect stale references, and measure a collision-free release target

  - name: scope-selection
    depends_on: preflight-sync
    prompt: |
      Select one bounded release scope from the read-only inventory and protect against stale milestone reuse.

      Milestone pre-check:
      - Query all milestones, open and closed, for the measured targetVersion.
      - If the target milestone already exists and is closed, halt and require a version bump or manual reopen.
      - If it exists and is open, record it for reuse in the local draft.
      - If it does not exist, record an idempotent milestone.ensure action in the local draft; do not create it here.

      Label semantics:
      - Reference `.codex/skills/pipeline/labels.md`.
      - Exclude blocked_by_decision, decision-needed, needs-review, verify-done, manual-action, and in-progress issues.
      - Prefer verify-ready, codex-release, oh-my-codex-release, claude-code-release, and documentation issues.
      - Sort by P1, P2, P3, then dependency order; cap a release unit at 7 issues.

      Output a read-only release manifest with issue number, title, prerequisite, effort, and labels.
    description: Read-only milestone check, label filter, and bounded release scope selection

  - name: compression-mode-eval
    depends_on: scope-selection
    prompt: |
      Evaluate compression mode.

      Use `compression_mode=docs-only` only when:
      - scope size is 3 or fewer issues
      - every scoped issue has at least one of documentation, automated, codex-release, oh-my-codex-release, claude-code-release, or enhancement-yaml-only

      Use `compression_mode=lite` only when:
      - scope size is 5 or fewer issues
      - every scoped issue is documentation, automated release-monitor, feedback, improvement, enhancement, YAML/config-only, or low-risk rule/skill text
      - no scoped issue requires TypeScript runtime behavior, package dependency changes, migration, or security-sensitive logic

      Gate transparency:
      - Do not add or change labels solely to qualify for docs-only or lite mode.
      - If labels were changed during triage and affect compression eligibility, state that fact in the mode decision.
      - Whenever a skill stage is replaced by integrated analysis, log a concrete justification:
        `[compression-mode] lite — skill stage replaced by integrated analysis; scope={n}; low-risk evidence={issue_refs}`.
      - If the justification cannot be stated concretely, do not compress that stage; run the full skill.

      Cross-tier pre-existing converged artifact substitution:
      - A triage, plan, deep-plan, or deep-verify step may be satisfied by an existing converged research/plan/verification artifact instead of a fresh skill spawn, even in standard mode.
      - The artifact must explicitly cover the scoped issue domain, be current for the release scope, and provide output equivalent to the skipped step.
      - This substitution never applies to implement, verify-build, release, publish, or CI/publish verification.
      - Log the artifact path or URL and why it is equivalent before substituting.

      In docs-only mode, replace heavyweight triage/plan/deep-plan/deep-verify spawns with direct summaries plus local self-review.
      In lite mode, keep a concise implementation plan and local self-review, but still run verify-build.
      In lite mode deep-verify, if the change set has no structural surface (for example workflow-YAML/docs-only with no agent/skill/guide/rule frontmatter changes), the R017/deep-verify spawn may be skipped and replaced by deterministic self-checks: template parity, multi-copy checksum, YAML parse, and the normal verify-build gate. Log:
        `[compression-mode] lite deep-verify — R017 spawn skipped (no structural surface); deterministic self-check only`.
      Otherwise use standard mode.
      Output the selected compression_mode for downstream steps.
    description: Evaluate docs-only compression eligibility

  - name: triage-draft
    depends_on: compression-mode-eval
    prompt: |
      Build a read-only triage draft from the measured release target, issue inventory, and repository evidence.

      - Use native repository exploration and local synthesis; do not execute a mutating triage skill.
      - Join each proposed action to direct issue, milestone, label, and code evidence.
      - Preserve the issue's existing priority unless direct evidence justifies a reviewed change.
      - Write a schemaVersion 1 JSON artifact with `evidenceJoined: true`, repository identity, and timestamped evidenceSources (`id`, `kind`, `source`, `observedAt`).
      - Give every action a stable id, rationale, and non-empty evidenceRefs that resolve to those sources; only `issue.update`, `label.ensure`, and `milestone.ensure` require a `desired` snapshot.
      - Include idempotent label.ensure, milestone.ensure, issue.update, or issue.comment actions only when evidence supports them.
      - Comment actions use a regular non-symlink body file with the exact standalone marker `<!-- triage-action:<action-id> -->`, a complete issue precondition, positive `bodyBytes`, and lowercase `bodySha256` computed from the exact reviewed bytes.
      - When a comment and issue update share one observed issue snapshot, order the comment before the update. Otherwise bind each later issue action precondition to the preceding desired state; the apply script validates the full sequence before its first write.
      - Do not set `reviewed: true`; that field belongs to evidence-review.
      - This step performs zero GitHub mutations.
    description: Produce a local evidence-joined mutation draft without changing GitHub

  - name: plan
    depends_on: triage-draft
    skill: release-plan
    description: Group the read-only triage draft into a release unit; skipped if compression_mode=docs-only
    input: triage-draft

  - name: deep-plan
    depends_on: plan
    skill: deep-plan
    description: Create detailed implementation plan for each release group; skipped if compression_mode=docs-only
    foreach: release-group

  - name: evidence-review
    depends_on: deep-plan
    prompt: |
      Review the release manifest, implementation plan, and triage draft against direct ground truth.

      - Re-read every referenced issue, label, and milestone and compare it with the draft precondition.
      - Confirm the evidence join covers every proposed mutation and no action is inferred from stale memory.
      - For every comment action, reopen the regular non-symlink body file and confirm its exact bytes still match `bodyBytes`, `bodySha256`, and the standalone marker before authorization.
      - Confirm targetVersion is absent from Git tags, public npm, and authenticated GitHub Packages evidence.
      - Confirm issue priority is preserved and release-note content yields before original issue context when a body needs fitting.
      - If any fact is stale or ambiguous, halt before mutation and regenerate the draft.
      - Reject unknown fields and unresolved evidenceRefs. If all checks pass, write `reviewed: true` and `reviewedAt` into the local artifact and read it back.
    description: Review joined evidence and authorize the local draft, without mutating GitHub

  - name: mutation-commit
    depends_on: evidence-review
    prompt: |
      Cross the mutation barrier exactly once by applying the reviewed local artifact:
      `node scripts/apply-triage-draft.mjs --draft <triage-draft.json> --repo <owner/repo> --json`.

      The script must reject stale preconditions, unknown fields, missing rationale/evidence, and malformed comment markers; skip already-satisfied actions; allow only declared action kinds; and perform direct readback after every write. Halt on any mismatch; do not improvise a replacement mutation command.
    description: Apply only the reviewed mutation draft with idempotency and direct readback

  - name: managed-shell-advisor-preflight
    depends_on: mutation-commit
    prompt: |
      Fail closed on the exact project-managed shell advisor before any
      implementation or release command is executed.

      1. Run exactly `omcustomcodex doctor --require-shell-advisor` and retain
         the command result. A generic OMX/plugin hook readiness result is not
         evidence for this gate.
      2. In Code Mode, call `tools.exec_command` and inspect the returned object.
         A completed gate succeeds only when
         `typeof gateResult.exit_code === "number"` and
         `gateResult.exit_code === 0`. If `exit_code` is absent and
         `session_id` is present, poll the same session with
         `tools.write_stdin` until a terminal result contains a numeric
         `exit_code`; an absent terminal code is failure. Do not infer success
         from stdout, even when it contains pass-looking text. Do not append
         `status=$?`, `path=...`, or `argv=...` to the nested shell command.
         Apply this same numeric-result and terminal-polling contract to every
         downstream implementation, verification, release, and R020 command
         launched through Code Mode.
      3. On a reported `missing` state only, run
         `omcustomcodex update --hooks`, then rerun the exact doctor gate. In a
         source checkout this must be the source-aware registry-only bootstrap;
         it must preserve tracked hook assets.
      4. In a source checkout, `assets-modified` requires review and restoration
         of the tracked source assets from the intended branch; `integrity-failed`
         may use the reviewed registry-only `omcustomcodex update --hooks` path.
         Never use `--force-overwrite-all` or call an internal hook installer in
         a source checkout. For a non-source project, halt for review and back up
         the existing registry/assets; only after that reviewed preservation may
         `omcustomcodex update --hooks --force-overwrite-all` restore packaged
         bytes. Rerun the exact doctor gate afterward.
      5. On `inactive`, halt: verify user-level `[features] hooks = true`, then
         verify project trust and review `/hooks` because an untrusted linked
         worktree can also surface as inactive. On `approval-needed`, halt for
         project trust and `/hooks` review. On `unverified`, halt until Codex
         app-server discovery can verify the exact managed chain.
      6. Never call `installNativeCodexHooks` or another internal installer as a
         remediation bypass. Never write trust state automatically, auto-approve `/hooks`, accept
         generic OMX/plugin hook readiness, add an outer Code Mode source parser,
         add a new exec-command matcher, or widen native tool names.

      Continue only after a fresh exact doctor result has numeric exit code 0.
      The advisor itself remains advisory; this readiness preflight is the
      fail-closed release boundary.
    description: Require the exact runnable managed shell advisor without changing trust

  - name: implement
    depends_on: managed-shell-advisor-preflight
    prompt: |
      Execute implementation plan with appropriate agents.

      Codex-native sensitive-path policy:
      - Codex-managed `.codex/` edits use the normal edit/patch flow.
      - Claude Code `bypassPermissions` can write `.claude/skills/`, `.claude/agents/`, and `.claude/commands/` directly on v2.1.121+, with broader protected-path writes available on v2.1.126+.
      - If a port requires `.claude` template parity changes, make the change explicit and verify sensitive-path guard tests.
      - Use `/tmp/{skill}-{timestamp}.md` only as a historical fallback for older Claude Code versions, non-bypass sessions, or runs that still surface a protected-path prompt.
      - Do not create a source commit. Leave the complete intended implementation
        tree for release-prepare and the post-verification commit gate.
    description: Execute implementation plan with appropriate agents
    foreach: planned-issue

  - name: release-prepare
    depends_on: implement
    prompt: |
      Finalize every intended local release source change before verification.
      This phase is local-only and creates no commit or external mutation.

      1. Immediately before the first version mutation, rerun
         `node scripts/resolve-release-target.mjs --expected-target <reviewed-target> --json`.
         Require every registry probe to pass, targetVersion to equal the
         reviewed target, sourceSha to equal the current pre-prepare HEAD, and
         targetVersion to remain absent from Git, public npm, and authenticated
         GitHub Packages. Halt on mismatch.
      2. Set the root `package.json` and `templates/manifest.json` versions to
         targetVersion as one local source preparation. Use same-directory
         exclusive temporary files for generated JSON writes; never route them
         through a shared temporary path.
      3. Promote `CHANGELOG.md` before the release PR/tag: move non-empty
         `## [Unreleased]` entries into `## [targetVersion] - YYYY-MM-DD`,
         recreate an empty Unreleased section, and add a concise user-visible
         summary instead of relying on GitHub auto-generated release notes.
         Finalize release-note source now rather than during release.
      4. Run the repository's canonical local generation/synchronization needed
         for package, template, plugin, manifest, lock, and documentation source.
         Review every generated change and leave it in the intended tree.
      5. Run `bash .github/scripts/verify-version-sync.sh` as an immediate
         preparation readback before tag or PR operations. Record the reviewed
         target and complete prepared file inventory as verify-build's input.
      6. Do not commit. Do not push, create a branch or tag, open a PR, publish,
         or mutate GitHub lifecycle state in this phase. Verification may change
         only repository-reviewed, explicitly allowlisted generated outputs.
         verify-build must read back every such output and freeze the final
         post-build inventory; any other source drift is failure.
    description: Finalize version, changelog, and generated release source without committing

  - name: verify-build
    depends_on: release-prepare
    prompt: |
      Project-specific build + test verification.

      Scope-change re-entry guard:
      - If a scoped issue or non-allowlisted tracked source is added or
        materially changed after release-prepare, halt this run and start a new
        acyclic preparation and verification run. Do not add a backward
        dependency from release or verification-artifact.
      - A canonical build may update only an explicitly allowlisted generated
        output under the readback contract below. Do not proceed from evidence
        collected before the complete prepared release source inventory.

      Shell execution discipline:
      - Run compound verification commands under `set -euo pipefail` so lint, typecheck, tests, and build halt on the first failed gate.
      - Do not rely on `set -o pipefail` alone for sequential verification chains.
      - Avoid reserved shell variable names in polling or status snippets (`status`, `path`, `argv`); use `run_status`, `cmd_path`, or `args` instead.

      For Node/Bun projects:
      1. Run `bun install` and halt on lockfile drift.
      2. Run `bun run lint` when available.
      3. Run `bun run typecheck` when available.
      4. Run `bun test` mandatorily; do not silently skip tests.
      5. Adopt the prior version's test result as the dynamic baseline. Current Codex baseline is 0 failures after #1328 verification.
      6. Halt if current failures exceed baseline; otherwise report pass/fail counts and delta.
      7. Run `bun run build` when available.
      8. Immediately diff the post-build tree against the release-prepare
         inventory. Accept a tracked change only when its path is an explicitly
         allowlisted generated output of the canonical build. For example,
         `.omcodex.lock.json` is allowed only when the repository's reviewed
         build contract identifies it as expected output. Reject unrelated
         source changes, lockfile drift, or unexpected index mutation.
      9. Read back and review the exact bytes and meaning of every accepted
         generated output, and prove it was derived from the current prepared
         source rather than treating build drift as an implicit fix.
      10. After that readback, freeze the exact final post-build inventory. Then
          materialize its tracked and intended untracked content as a Git tree
          without touching the real index:
          - First require the complete NUL-safe status inventory to equal the
            reviewed final inventory; reject every unrelated path.
          - Create a private mode-0700 runtime directory and an absent
            `reviewIndex` path. Run `GIT_INDEX_FILE="$reviewIndex" git read-tree HEAD`,
            then `GIT_INDEX_FILE="$reviewIndex" git add -A -- .` only after the
            inventory equality check.
          - Set `reviewedTree=$(GIT_INDEX_FILE="$reviewIndex" git write-tree)`.
            Require a 40-character lowercase hexadecimal id, run
            `git cat-file -e "$reviewedTree^{tree}"`, require
            `git cat-file -t "$reviewedTree"` to equal `tree`, remove the
            temporary index, and prove the real index was unchanged.
      11. Pin the final post-build inventory to reviewedTree and pass both to
          verify/deep-verify. Pipeline-deferred review must use
          `git diff --no-ext-diff --binary develop "$reviewedTree"` as the actual
          six-reviewer input; falling back to HEAD or a live dirty diff is
          forbidden. Permit no later tracked source or index mutation.

      Documentation/template validation:
      - For local or CI docs validation, run `bun run .github/scripts/validate-docs.ts --programmatic-only` (or the repo's equivalent validate-docs command with `--programmatic-only`) before assuming a validation failure is an authentication failure.
      - Treat interactive/auth-dependent validate-docs output as inconclusive until the programmatic-only path has been tried.

      Halt on lint errors, typecheck errors, new test failures, build failure, or lockfile drift.
    description: Auto-detected build + test verification with mandatory bun test baseline delta guard

  - name: verify
    depends_on: verify-build
    skill: deep-verify
    description: Multi-angle Rounds 1–7 review of required reviewedTree input; Pipeline-deferred finalization remains pending for verification-artifact

  - name: verification-artifact
    depends_on: verify
    prompt: |
      Finalize the reviewed tree as one local Lore commit, then persist exact
      deep-verify evidence. This is the only source-commit boundary in the
      release DAG; nothing may mutate tracked source afterward.

      Helper and variable initialization:
      - From the active loaded `deep-verify` skill catalog entry, resolve its
        exact `SKILL.md`, then resolve `artifactHelper` only as its sibling
        `scripts/artifact-contract.mjs`. Require regular non-symlink runtime
        assets; never guess or search a source, installed, template, or plugin
        root.
      - Before use, define `repository`, `releaseVersion`, `executionMode`,
        `reviewedTree`, `artifactHelper`, `artifactInputFile`, `writerProjectionFile`,
        `candidateSelectionFile`, `validationProjectionFile`, and
        `selectionFile`. Resolve repository and releaseVersion from direct
        reviewed evidence. Set executionMode to exactly one of `standard`,
        `docs-only-self-review`, `lite-deterministic`, or
        `converged-substitution`.

      Reviewed tree and commit identity:
      1. Require the Pipeline-deferred finalization handoff from the same
         deep-verify execution and verify-build's frozen final post-build
         inventory plus reviewedTree. Require reviewedTree to be a 40-character
         lowercase hexadecimal id, run
         `git cat-file -e "$reviewedTree^{tree}"`, require
         `git cat-file -t "$reviewedTree"` to equal `tree`, and prove the
         Rounds 1–7 evidence used
         `git diff --no-ext-diff --binary develop "$reviewedTree"`. Reject HEAD
         fallback or any change after the freeze. The deep-verify execution
         remains pending, not completed or READY, until this gate succeeds.

      2. Branch placement before commit:
         - Set `exactBranch="release/v${releaseVersion}"` and capture the current
           pre-commit HEAD. Before staging or committing, run
           `git branch --list release --format='%(refname:short)'`. A local
           `release` ref blocks the required nested ref.
         - If local `release` exists, prove it is merged or backed up and prefer
           `git branch -m release releases-tracking` when preservation is
           required. Never delete it without explicit approval, and halt if the
           preservation target already exists or cannot be proven safe.
         - Require the local branch named exactly `release/v${releaseVersion}`.
           If absent, create and switch to it from the captured pre-commit HEAD.
           If present, require it to point to that same HEAD before switching.
           If already current, require its tip to equal that HEAD. This is a
           local-only operation; do not push or perform any external mutation.
         - After branch placement, prove the final post-build inventory still
           materializes exactly as reviewedTree. Any checkout-induced or
           unrelated drift fails closed.

      3. Reject unrelated staged or unstaged source, then stage exactly the
         already-reviewed tree with `git read-tree "$reviewedTree"`. Record
         `stagedTree=$(git write-tree)` and require stagedTree to equal the
         pinned reviewedTree byte-for-byte before committing.
      4. Create the local Lore commit now, after R017/deep-verify and never
         before it. Set `verifiedSha` from the new 40-character lowercase HEAD,
         set `committedTree` from `verifiedSha^{tree}`, and require the committed
         tree to equal both stagedTree and reviewedTree byte-for-byte. Any
         mismatch fails closed.
      5. Permit no tracked source or index mutation after this equality proof.
         Do not run any source-mutating build, package, sync, or autofix command
         after the freeze. If another such command is required, halt and start a
         new acyclic pipeline run that produces a new `reviewedTree`.

      Mode payload:
      - `standard`: build the schemaVersion 1 artifact from the same pending
        deep-verify execution's findings, terminal outcomes, verdict, and gate
        evidence.
      - `docs-only-self-review` and `lite-deterministic`: build the same schema
        from the substituted review and record every reduced or not-run gate.
      - `converged-substitution`: first allow only an exact current-commit
        repository/release/verifiedSha selection. If no such artifact exists,
        build a new explicit `converged-substitution` artifact from the current
        equivalent evidence and not-run gates. Reusing old-SHA evidence or
        changing another artifact's mode is forbidden; never relabel it.

        For the exact-selection branch, create candidateSelectionFile with the
        exclusive regular mode-0600 contract, run:

          node "$artifactHelper" select \
            --project-root "$PWD" \
            --repository "$repository" \
            --release-version "$releaseVersion" \
            --verified-sha "$verifiedSha" >"$candidateSelectionFile"

        Parse it strictly as JSON data and require exact identity before defining
        artifactFile from `.path`. Only a verified no-matching-artifact result may
        choose the explicit write branch; malformed, ambiguous, or undecodable
        candidates fail closed instead of falling back.

      Safe input and writer projection:
      1. Create `artifactInputFile` and `writerProjectionFile` as exclusive
         regular, non-symlink, single-link files with mode 0600 in a private
         runtime directory. For a write branch, serialize JSON with top-level
         keys exactly `{artifact, body}`; reparse it and reject any other key.
      2. The artifact object must use repository, releaseVersion, verifiedSha,
         and executionMode already defined above. The safe body may summarize
         reviewed evidence but must exclude credentials, complete environment
         dumps, unredacted sensitive logs, and shell-interpolated finding text.
      3. Run the `artifact-contract.mjs write` command with the input file and
         direct stdout to the already-verified regular projection file:

          node "$artifactHelper" write \
            --project-root "$PWD" \
            --input "$artifactInputFile" >"$writerProjectionFile"

      4. Parse writerProjectionFile strictly as JSON data, require its artifact
         identity to match, extract its `.path` field without evaluation or
         interpolation, and only then define `artifactFile`. Require artifactFile
         to name a regular non-symlink file under the canonical session tree.
         In the exact-selection converged branch, parse the selector's `.path`
         the same way to define artifactFile; do not run the writer.

      Validation and selection:
      - Create validationProjectionFile and selectionFile with the same
        exclusive regular mode-0600 contract before redirecting output.
      - Run readback validation and exact selection only after artifactFile and
        verifiedSha are defined:

          node "$artifactHelper" validate \
            --file "$artifactFile" >"$validationProjectionFile"
          node "$artifactHelper" select \
            --project-root "$PWD" \
            --repository "$repository" \
            --release-version "$releaseVersion" \
            --verified-sha "$verifiedSha" >"$selectionFile"

      Parse both projections as JSON data. Require exact repository, version,
      SHA, executionMode, and selected path correlation with the local Lore
      commit. Missing, malformed, stale, wrong-mode, non-regular, ambiguous, or
      collision evidence must fail closed. Persist the validated selected path
      plus identity for release and post-release; conversation-only evidence is
      not completion.
    description: Commit the reviewed tree, then safely write, validate, and select exact evidence

  - name: release
    depends_on: verification-artifact
    prompt: |
      Push and merge the already-prepared, already-verified local release commit.
      This phase performs readback plus push/PR/merge operations only.

      Prepared metadata readback:
      - Parse the verification-artifact handoff as data and require current HEAD,
        its tree, repository, releaseVersion, and selected artifact to equal the
        recorded verifiedSha and reviewed tree.
      - Derive `exactBranch="release/v${releaseVersion}"`, require the current
        branch to be that already-existing exact release branch, and require its
        local ref to point to verifiedSha. Do not create, rename, or switch
        branches in this phase.
      - Read `package.json`, `templates/manifest.json`, and `CHANGELOG.md`; require
        both manifests and the promoted changelog to match releaseVersion. Run
        `bash .github/scripts/verify-version-sync.sh` without changing files.
      - Require a clean worktree/index and prove verifiedSha will be the final PR
        head. Any mismatch halts this pipeline run. No version, changelog,
        generated source, or release-note source is changed here, and no new
        source commit is created after verification-artifact.

      External-write ownership gate:
      - Detect repository-owned tag and release automation before any external write.
      - When automation owns the transition, merge the reviewed release PR and observe the workflow instead of duplicating its writes.
      - Do not create or push tags manually while repository automation owns them.
      - Any manual issue or milestone recovery must use a fresh reviewed local mutation draft, evidence review, `scripts/apply-triage-draft.mjs`, and direct readback.
      - Stage the reviewed PR body through `scripts/safe-command-payload.mjs`,
        push only the already-existing exact release branch at verifiedSha, open
        the PR to `develop`, require all checks at that exact head, and merge
        only after direct readback proves them green.
      - Merge without `--delete-branch`; remote merge mutation and branch cleanup
        are separate operations in linked or multi-worktree execution.
      - Immediately read the PR back and require `state=MERGED`, a non-empty
        `mergedAt`, and an exact `mergeCommit.oid` before any cleanup.
      - Only after that authoritative readback, delete the remote release ref with
        `gh api --method DELETE "repos/${repository}/git/refs/heads/${exactBranch}"`.
        Treat an already-absent ref as idempotent only after the merged readback,
        then query it again and require that the remote ref is absent.
      - Never switch, delete, or rename a local branch as part of remote cleanup.
    description: Read back and publish the immutable verified release commit

  - name: publish
    prompt: |
      Publish the validated release artifact after the release PR/branch stage.

      Detect repository-owned tag and release automation before any external write.
      When automation owns the transition, merge the reviewed release PR and observe the workflow; do not duplicate tag, publication, issue, or milestone writes.

      Project-specific behavior:
      - npm package:
        1. Confirm package name and current version from package.json
        2. Check public npm and authenticated GitHub Packages registry state
        3. Require that version to equal the immutable verified release commit;
           halt instead of changing source or version after the artifact gate
        4. Prefer the repository's release workflow trigger; publish directly only when the documented contract has no automation owner
        5. Verify publication in both registries, including the expected GitHub Packages version
      - GitHub-release artifact project:
        1. Prove whether repository automation or a documented manual path owns the tag
        2. Observe the automation, or use the documented manual path only when no automation owner exists
        3. Verify the release exists and assets are available

      Do not create or push tags manually while repository automation owns them.
      Any manual issue or milestone recovery must use a fresh reviewed local mutation draft, evidence review, `scripts/apply-triage-draft.mjs`, and direct readback.

      Halt and report on auth, versioning, or publish verification failures.
    description: Publish the release artifact and verify external availability
    depends_on: release

  - name: post-release-verification-artifact
    depends_on: publish
    prompt: |
      Re-verify the released merge and write new durable evidence before
      post-release Source B runs.

