# Pipeline Registry

description: Registry of available workflow templates for the /pipeline skill

pipelines:
  - name: code-review
    path: ./examples/code-review.yaml
    description: Full code review workflow with language detection

templates:
  - name: pipeline-template
    path: ./templates/pipeline-template.yaml
    description: Base template for creating new pipelines

usage:
  run: "/pipeline <name>"
  list: "/pipeline"
  resume: "/pipeline resume"
  create: "Create workflows/<name>.yaml from templates/pipeline-template.yaml"
