name: auto-dev
description: "Automated development pipeline — from issue triage to release"
version: "2.2.0"

# Design rule: each pipeline run produces ONE bounded release unit (3-7 issues), not all open issues.
# This pipeline is a project-agnostic template. Project-specific overrides belong in
# the project's own workflows/auto-dev.yaml (e.g., AgentNav, second-brain).

steps:
  - name: preflight-sync
    prompt: |
      Phase 0 — Sync local with remote and establish read-only release evidence.

      1. Fetch all remote state:
         git fetch --all --tags --prune

      2. Detect behind count vs origin/current branch:
         current_branch=$(git rev-parse --abbrev-ref HEAD)
         behind=$(git rev-list --count HEAD..origin/$current_branch)

      3. If behind > 0:
         - Working tree clean (git status --short empty):
           git pull --ff-only
           report: "[preflight-sync] synced $behind commits"
         - Working tree dirty:
           HALT with "[preflight-sync] $behind commits behind, working tree dirty — manual reconcile required"
           exit 1

      4. Report current state:
         - Latest tag: git tag --sort=-v:refname | head -1
         - Local HEAD: git rev-parse --short HEAD
         - Behind state: synced or 0

      5. Resolve the release target from direct evidence:
         - Run `node scripts/resolve-release-target.mjs --json`.
         - The resolver must measure stable versions from Git tags, public npm, and authenticated GitHub Packages.
         - Persist `gitLatest`, `npmLatest`, `ghpLatest`, `targetVersion`, measurement time, source SHA, and sanitized probe summaries.
         - Treat session memory as advisory only. Halt on network, authentication, parse, or ambiguous-empty evidence.

      6. Cross-reference checks (advisory, do NOT mutate):
         a. Memory vs measured evidence:
            - Compare the remembered release with the resolver's baseVersion.
            - If they differ, warn and keep the measured result authoritative.
         b. Issue body stale version references:
            - Retrieve open issues: gh issue list --state open --limit 100 --json number,body
            - Extract vX.Y.Z patterns and compare them with `git tag --list`.
            - Warn when an issue references a missing tag; do not rewrite the issue here.

      7. Read the complete GitHub inventory without changing it:
         - gh issue list --state open --limit 100 --json number,title,labels,body,milestone
         - gh issue list --state open --label codex-release --limit 100 --json number,title,labels,body,milestone
         - gh issue list --state open --label oh-my-codex-release --limit 100 --json number,title,labels,body,milestone
         - Read all open and closed milestones and existing lifecycle labels.
         - Group issues by dependency, release-monitor status, decision block, effort, and priority.
         - Never terminate auto-dev from an empty `verify-done` query alone while open release-monitor issues remain.

      This phase is read-only with respect to GitHub. Missing labels, milestones, assignments, or comments become proposed actions in triage-draft.
    description: "Sync remote state, measure all release registries, and inventory issues without GitHub mutation"
  - name: scope-selection
    prompt: |
      Select a single bounded release scope (3-7 issues) for THIS pipeline run using the measured targetVersion.

      ## Step 0 — Read-only milestone state pre-check

      Query all milestones (open and closed) for targetVersion.
      - If the target milestone exists and is closed, HALT for target re-resolution or an explicit reviewed reopen action.
      - If it exists and is open, record its number for the draft precondition.
      - If it does not exist, record a `milestone.ensure` proposal with a null precondition; do not create it here.

      ## Step 1 — Label-based filtering

      Reference label semantics: .codex/skills/pipeline/labels.md

      Apply filter rules:
      - EXCLUDE: blocked_by_decision == true OR labels intersect {decision-needed, needs-review, verify-done, manual-action, in-progress}
      - INCLUDE (preferred): labels intersect {verify-ready, codex-release, oh-my-codex-release, claude-code-release, documentation}
      - INCLUDE (standard): P1/P2/P3 issues not in excluded set
      - Tie-break: P1 > P2 > P3 > unclassified

      ## Step 2 — Selection rules

      1. Use the resolver's targetVersion; do not independently choose a semver.
      2. Apply Step 1 filtering without changing labels.
      3. Include release-monitor issues after read-only impact analysis.
      4. Sort by dependency: prerequisites before dependents.
      5. Cap at 7 issues; if priority issues < 7, stop at that priority.
      6. Minimum 1 issue or 1 evidence-backed release-monitor action; otherwise halt with "no eligible issues for auto-dev run".

      Output and persist a read-only markdown release manifest:
        | order | # | title | prerequisite | effort | labels |

      Do not assign issues, create milestones, comment, close, reopen, or edit labels in this phase.
    description: "Read-only milestone check, label filter, and bounded targetVersion scope"
    depends_on: preflight-sync
  - name: compression-mode-eval
    prompt: |
      Evaluate whether this pipeline run qualifies for compression mode.

      Reference: .codex/skills/pipeline/labels.md — "Compression Eligibility" section.

      Conditions for compression_mode=docs-only:
      1. Scope size is 3 or fewer issues.
      2. All scoped issues have labels intersecting {documentation, automated, codex-release, oh-my-codex-release, claude-code-release, enhancement-yaml-only}.

      Conditions for compression_mode=lite:
      1. Scope size is 5 or fewer issues.
      2. All scoped issues are documentation, automated release-monitor, feedback, improvement, enhancement, YAML/config-only, or low-risk rule/skill text.
      3. No scoped issue requires TypeScript runtime behavior, package dependency changes, migration, or security-sensitive logic.

      Gate transparency:
      - Do not add or change labels solely to qualify for docs-only or lite mode.
      - If labels were changed during triage and affect compression eligibility, state that fact in the mode decision.

      If both conditions match:
      - Set compression_mode=docs-only.
      - Triage-draft step: perform a concise evidence join without skipping the mutation barrier.
      - Plan step: skip release-plan skill; single-response plan instead.
      - Deep-plan step: skip deep-plan skill; single-response implementation notes instead.
      - Deep-verify step: skip deep-verify skill; perform self-review checklist instead.
      - Log: "[compression-mode] docs-only compression activated (scope={n}, all docs/yaml labels)".

      If lite conditions match:
      - Set compression_mode=lite.
      - Keep a concise implementation plan and local self-review.
      - Still run verify-build.
      - MANDATORY justification log when replacing a skill stage with integrated analysis:
        "[compression-mode] lite — skill stage replaced by integrated analysis; scope={n}; low-risk evidence={issue_refs}".
      - If the justification cannot be stated concretely, do not compress that stage; run the full skill.
      - For lite deep-verify, if the change set has no structural surface (for example workflow-YAML/docs-only with no agent/skill/guide/rule frontmatter changes), the R017/deep-verify spawn may be skipped and replaced by deterministic self-checks: template parity, multi-copy checksum, YAML parse, and the normal verify-build gate. Log:
        "[compression-mode] lite deep-verify — R017 spawn skipped (no structural surface); deterministic self-check only".
      - Log: "[compression-mode] lite compression activated (scope={n}, low-risk docs/rules/skills)".

      Cross-tier pre-existing converged artifact substitution:
      - A triage, plan, deep-plan, or deep-verify step may be satisfied by an existing converged research/plan/verification artifact instead of a fresh skill spawn, even in standard mode.
      - The artifact must explicitly cover the scoped issue domain, be current for the release scope, and provide output equivalent to the skipped step.
      - This substitution never applies to implement, verify-build, release, publish, or CI/publish verification.
      - Log the artifact path or URL and why it is equivalent before substituting.

      Otherwise:
      - Set compression_mode=standard.
      - Execute the detailed plan, implementation, verification, release, and CI stages normally.
      - Log: "[compression-mode] standard mode (scope={n}, mixed labels or large scope)".

      Output compression_mode as pipeline state for downstream steps.
    description: "Evaluate compression eligibility; set compression_mode state"
    depends_on: scope-selection

  - name: triage-draft
    prompt: |
      Produce a local schemaVersion 1 triage draft from the release manifest and direct repository/GitHub evidence.

      - Use native repository exploration and local synthesis; do not execute a mutating triage tool.
      - Preserve the original issue priority unless current direct evidence justifies a change.
      - Set `evidenceJoined: true` only after joining every proposed action to one or more current evidence sources.
      - Record each evidence source with a stable id, kind, source URI, and observedAt timestamp.
      - Record every action with a stable id, kind, rationale, and non-empty evidenceRefs; only `issue.update`, `label.ensure`, and `milestone.ensure` require a `desired` snapshot.
      - Comment actions use a regular non-symlink body file with the exact standalone marker `<!-- triage-action:<action-id> -->`, a complete issue precondition, positive `bodyBytes`, and lowercase `bodySha256` computed from the exact reviewed bytes.
      - When a comment and issue update share one observed issue snapshot, order the comment before the update. Otherwise bind each later issue action precondition to the preceding desired state; the apply script validates the full sequence before its first write.
      - Set `reviewed: false` and `reviewedAt: null`; evidence-review owns authorization.
      - Write the JSON artifact locally and read it back. This step performs zero GitHub mutations.
    description: "Build an evidence-joined local triage draft without changing GitHub"
    depends_on: compression-mode-eval
  - name: plan
    skill: release-plan
    description: "Release unit plan from triaged issues — skipped if compression_mode=docs-only"
    depends_on: triage-draft

  - name: deep-plan
    skill: deep-plan
    description: "Research-validated implementation plan (research → plan → verify) — skipped if compression_mode=docs-only"
    depends_on: plan

  - name: evidence-review
    prompt: |
      Review the implementation plan and triage draft against direct ground truth before any triage mutation.

      1. Re-read every referenced issue, label, milestone, repository file, and release-target artifact.
      2. Confirm every evidenceRef resolves to a current evidence source and every rationale follows from that evidence.
      3. Confirm each precondition still matches, targetVersion remains the stable max-plus-patch result, and it is absent from Git, public npm, and GitHub Packages.
      4. Confirm the draft has no unknown fields, no substring-only comment markers, and no priority rewrite without direct evidence.
      5. For every comment action, reopen the regular non-symlink body file and confirm its exact bytes still match `bodyBytes`, `bodySha256`, and the standalone marker before authorization.
      6. On stale, missing, or ambiguous evidence: halt and regenerate triage-draft.
      7. On success: set `reviewed: true`, set a fresh `reviewedAt`, write the artifact, and perform local direct readback.
    description: "Authorize only a complete evidence-joined mutation draft"
    depends_on: deep-plan

  - name: mutation-commit
    prompt: |
      Cross the triage mutation barrier once using only the reviewed artifact:

        node scripts/apply-triage-draft.mjs --draft <triage-draft.json> --repo <owner/repo> --json

      The script must reject stale preconditions, unknown fields/action kinds, missing rationale/evidence, and malformed comment markers. It must skip already-satisfied actions idempotently and perform direct readback after every write. Halt on mismatch; do not improvise an alternate mutation command.
    description: "Apply the reviewed draft idempotently with direct readback"
    depends_on: evidence-review

  - name: managed-shell-advisor-preflight
    depends_on: mutation-commit
    prompt: |
      Fail closed on the exact project-managed shell advisor before any
      implementation or release command is executed.

      1. Run exactly `omcustomcodex doctor --require-shell-advisor` and retain
         the command result. A generic OMX/plugin hook readiness result is not
         evidence for this gate.
      2. In Code Mode, call `tools.exec_command` and inspect the returned object.
         A completed gate succeeds only when
         `typeof gateResult.exit_code === "number"` and
         `gateResult.exit_code === 0`. If `exit_code` is absent and
         `session_id` is present, poll the same session with
         `tools.write_stdin` until a terminal result contains a numeric
         `exit_code`; an absent terminal code is failure. Do not infer success
         from stdout, even when it contains pass-looking text. Do not append
         `status=$?`, `path=...`, or `argv=...` to the nested shell command.
         Apply this same numeric-result and terminal-polling contract to every
         downstream implementation, verification, release, and R020 command
         launched through Code Mode.
      3. On a reported `missing` state only, run
         `omcustomcodex update --hooks`, then rerun the exact doctor gate. In a
         source checkout this must be the source-aware registry-only bootstrap;
         it must preserve tracked hook assets.
      4. In a source checkout, `assets-modified` requires review and restoration
         of the tracked source assets from the intended branch; `integrity-failed`
         may use the reviewed registry-only `omcustomcodex update --hooks` path.
         Never use `--force-overwrite-all` or call an internal hook installer in
         a source checkout. For a non-source project, halt for review and back up
         the existing registry/assets; only after that reviewed preservation may
         `omcustomcodex update --hooks --force-overwrite-all` restore packaged
         bytes. Rerun the exact doctor gate afterward.
      5. On `inactive`, halt: verify user-level `[features] hooks = true`, then
         verify project trust and review `/hooks` because an untrusted linked
         worktree can also surface as inactive. On `approval-needed`, halt for
         project trust and `/hooks` review. On `unverified`, halt until Codex
         app-server discovery can verify the exact managed chain.
      6. Never call `installNativeCodexHooks` or another internal installer as a
         remediation bypass. Never write trust state automatically, auto-approve `/hooks`, accept
         generic OMX/plugin hook readiness, add an outer Code Mode source parser,
         add a new exec-command matcher, or widen native tool names.

      Continue only after a fresh exact doctor result has numeric exit code 0.
      The advisor itself remains advisory; this readiness preflight is the
      fail-closed release boundary.
    description: "Require the exact runnable managed shell advisor without changing trust"


  - name: implement
    prompt: |
      Execute the deep-plan output for the scoped release manifest.

      Per-issue lifecycle:
      1. Before dispatch, read back each issue's complete current state and build a fresh local schemaVersion 1 lifecycle draft for the start transition:
         - Preserve the current state and milestone, assign the issue, add in-progress without discarding unrelated labels, and propose the implementation-started comment using a regular non-symlink body file, an exact standalone idempotency marker, positive `bodyBytes`, and lowercase `bodySha256` bound to the reviewed bytes.
         - Order that comment before the issue update because both actions share the same observed precondition; the apply script validates the complete sequential precondition chain before its first write.
         - Join every proposed action to the current issue/label/milestone evidence, leave `reviewed: false`, and write then locally read back the draft.
      2. Apply the mandatory lifecycle mutation protocol to the start draft: reviewed draft -> evidence review -> apply-triage-draft -> direct readback.
         - Re-read every referenced GitHub resource, require exact preconditions and evidenceRefs, then set a fresh `reviewedAt` only when the evidence review passes.
         - Apply only with `node scripts/apply-triage-draft.mjs --draft <lifecycle-draft.json> --repo <owner/repo> --json`; halt on any rejection or readback mismatch.
      3. Dispatch specialist agents per file domain:
         - Detect file types in scope and route to matching agent
         - Use specialized agents (lang-*, be-*, fe-*, infra-*) over general-purpose
      4. TDD via superpowers:test-driven-development when tests apply
      5. Do not create per-issue source commits. Preserve issue attribution in
         the final Lore commit/PR body and leave the complete intended tree for
         release-prepare plus the post-verification commit gate.
      6. After the implementation outcome is known, re-enter the lifecycle mutation protocol with new direct evidence and a fresh draft; the start draft cannot authorize outcome-dependent actions.
         - Success draft: preserve unrelated issue state, remove in-progress, and add verify-ready.
         - Failure draft: preserve unrelated issue state, place the error-summary comment before the update when both share the observed snapshot, then remove in-progress and add needs-review. Bind the comment to a regular non-symlink body file, a new exact standalone idempotency marker, positive `bodyBytes`, and lowercase `bodySha256` for the reviewed bytes.
         - For either outcome repeat reviewed draft -> evidence review -> apply-triage-draft -> direct readback, with fresh preconditions, evidence timestamps, and `reviewedAt`.
      7. Any later retry or outcome-dependent lifecycle action must re-enter the same fresh-draft protocol. Never reuse a stale reviewed artifact.

      Rules:
      - Parallel execution per R009 (max 4 concurrent, respect dependencies)
      - Issues whose prerequisites failed in-run MUST be skipped (log reason)
      - No direct orchestrator writes (R010)
      - Every implementation-phase GitHub lifecycle change, including start, success, failure, retry, labels, assignment, and comments, must use the reviewed local draft and `scripts/apply-triage-draft.mjs` with direct readback.
      - Never run a direct lifecycle mutation command or improvise a fallback when the draft, evidence review, apply step, or readback fails; halt and regenerate the draft from current evidence.
      - Codex-managed `.codex/` edits use the normal edit/patch flow
      - Claude Code `bypassPermissions` can write `.claude/skills/`, `.claude/agents/`, and `.claude/commands/` directly on v2.1.121+, with broader protected-path writes available on v2.1.126+
      - If `.claude` template parity changes are required, make them explicit and verify sensitive-path guard tests
      - Use `/tmp/{skill}-{timestamp}.md` only as a historical fallback for older Claude Code versions, non-bypass sessions, or runs that still surface a protected-path prompt
    description: "Per-issue implementation with lifecycle and specialist routing"
    depends_on: managed-shell-advisor-preflight

  - name: release-prepare
    depends_on: implement
    prompt: |
      Finalize every intended local release source change before verification.
      This phase is local-only and creates no commit or external mutation.

      1. Immediately before the first version mutation, rerun
         `node scripts/resolve-release-target.mjs --expected-target <reviewed-target> --json`.
         Require every registry probe to pass, targetVersion to equal the
         reviewed target, sourceSha to equal the current pre-prepare HEAD, and
         targetVersion to remain absent from Git, public npm, and authenticated
         GitHub Packages. Halt on mismatch.
      2. Set the root `package.json` and `templates/manifest.json` versions to
         targetVersion as one local source preparation. Use same-directory
         exclusive temporary files for generated JSON writes; never route them
         through a shared temporary path.
      3. Promote `CHANGELOG.md` before the release PR/tag: move non-empty
         `## [Unreleased]` entries into `## [targetVersion] - YYYY-MM-DD`,
         recreate an empty Unreleased section, and add a concise user-visible
         summary instead of relying on GitHub auto-generated release notes.
         Finalize release-note source now rather than during release. Use the
         Release notes via omcustomcodex-release-notes skill in this local phase
         if the repository contract requires it.
      4. Run the repository's canonical local generation/synchronization needed
         for package, template, plugin, manifest, lock, and documentation source.
         Review every generated change and leave it in the intended tree.
      5. Run `bash .github/scripts/verify-version-sync.sh` as an immediate
         preparation readback before tag or PR operations. Record the reviewed
         target and complete prepared file inventory as verify-build's input.
      6. Do not commit. Do not push, create a branch or tag, open a PR, publish,
         or mutate GitHub lifecycle state in this phase. Verification may change
         only repository-reviewed, explicitly allowlisted generated outputs.
         verify-build must read back every such output and freeze the final
         post-build inventory; any other source drift is failure.
    description: "Finalize version, changelog, and generated release source without committing"

  - name: verify-build
    prompt: |
      Project-specific build + test verification.

      Scope-change re-entry guard:
      - If a scoped issue or non-allowlisted tracked source is added or
        materially changed after release-prepare, halt this run and start a new
        acyclic preparation and verification run. Do not add a backward
        dependency from release or verification-artifact.
      - A canonical build may update only an explicitly allowlisted generated
        output under the readback contract below. Do not proceed from evidence
        collected before the complete prepared release source inventory.

      Shell execution discipline:
      - Run compound verification commands under `set -euo pipefail` so lint, typecheck, tests, and build halt on the first failed gate.
      - Do not rely on `set -o pipefail` alone for sequential verification chains.
      - Avoid reserved shell variable names in polling or status snippets (`status`, `path`, `argv`); use `run_status`, `cmd_path`, or `args` instead.

      For Node/Bun projects (this repo):
      1. bun install — verify lockfile sync (halt on lockfile drift)
      2. bun run lint (if package.json has lint script)
      3. bun run typecheck (if available)
      4. bun test — MANDATORY, no silent skip
         - Baseline reference: port issue #1328 historically documented upstream test debt; current Codex baseline is 0 failures.
         - Each release: adopt the prior version's test result as baseline (dynamic, not hardcoded).
         - Compute current pass/fail counts.
         - If current FAIL count > baseline: NEW regression detected, halt and report failure list.
         - If current FAIL count <= baseline: continue with advisory log "X failures (baseline {n}, delta {d})".
      5. Build verification (if package has build script)
      6. Immediately diff the post-build tree against the release-prepare
         inventory. Accept a tracked change only when its path is an explicitly
         allowlisted generated output of the canonical build. For example,
         `.omcodex.lock.json` is allowed only when the repository's reviewed
         build contract identifies it as expected output. Reject unrelated
         source changes, lockfile drift, or unexpected index mutation.
      7. Read back and review the exact bytes and meaning of every accepted
         generated output, and prove it was derived from the current prepared
         source rather than treating build drift as an implicit fix.
      8. Before freezing, run `bash .github/scripts/verify-wiki-sync.sh`
         and require success. This read-only drift gate must execute after all
         intended Wiki/source updates and before `git write-tree`; a failure
         returns to source preparation instead of accepting post-freeze repair.
      9. After that readback and Wiki gate, freeze the exact final post-build
         inventory. Then materialize its tracked and intended untracked content as a Git tree
         without touching the real index:
         - First require the complete NUL-safe status inventory to equal the
           reviewed final inventory; reject every unrelated path.
         - Create a private mode-0700 runtime directory and an absent
           `reviewIndex` path. Run `GIT_INDEX_FILE="$reviewIndex" git read-tree HEAD`,
           then `GIT_INDEX_FILE="$reviewIndex" git add -A -- .` only after the
           inventory equality check.
         - Set `reviewedTree=$(GIT_INDEX_FILE="$reviewIndex" git write-tree)`.
           Require a 40-character lowercase hexadecimal id, run
           `git cat-file -e "$reviewedTree^{tree}"`, require
           `git cat-file -t "$reviewedTree"` to equal `tree`, remove the
           temporary index, and prove the real index was unchanged.
      10. Pin the final post-build inventory to reviewedTree and pass both to
         deep-verify. Pipeline-deferred review must use
         `git diff --no-ext-diff --binary develop "$reviewedTree"` as the actual
         six-reviewer input; falling back to HEAD or a live dirty diff is
         forbidden. Permit no later tracked source or index mutation.

      Documentation/template validation:
      - For local or CI docs validation, run `bun run .github/scripts/validate-docs.ts --programmatic-only` (or the repo's equivalent validate-docs command with `--programmatic-only`) before assuming a validation failure is an authentication failure.
      - Treat interactive/auth-dependent validate-docs output as inconclusive until the programmatic-only path has been tried.

      For Python/Go/Docker/static-site projects: auto-detect and run equivalent checks.

      Halt conditions:
      - Lint errors
      - Typecheck errors
      - New test failures relative to baseline
      - Build failure
      - Lockfile drift

      Halt → report exact command + stderr + delta details. Do NOT proceed to release on any halt.
    description: "Auto-detected build + test verification (bun test with baseline delta guard)"
    depends_on: release-prepare

  - name: deep-verify
    skill: deep-verify
    description: "Multi-angle Rounds 1–7 review of required reviewedTree input; Pipeline-deferred finalization remains pending for verification-artifact"
    depends_on: verify-build

  - name: verification-artifact
    depends_on: deep-verify
    prompt: |
      Finalize the reviewed tree as one local Lore commit, then persist exact
      deep-verify evidence. This is the only source-commit boundary in the
      release DAG; nothing may mutate tracked source afterward.

      Helper and variable initialization:
      - From the active loaded `deep-verify` skill catalog entry, resolve its
        exact `SKILL.md`, then resolve `artifactHelper` only as its sibling
        `scripts/artifact-contract.mjs`. Require regular non-symlink runtime
        assets; never guess or search a source, installed, template, or plugin
        root.
      - Before use, define `repository`, `releaseVersion`, `executionMode`,
        `reviewedTree`, `artifactHelper`, `artifactInputFile`, `writerProjectionFile`,
        `candidateSelectionFile`, `validationProjectionFile`, and
        `selectionFile`. Resolve repository and releaseVersion from direct
        reviewed evidence. Set executionMode to exactly one of `standard`,
        `docs-only-self-review`, `lite-deterministic`, or
        `converged-substitution`.

      Reviewed tree and commit identity:
      1. Require the Pipeline-deferred finalization handoff from the same
         deep-verify execution and verify-build's frozen final post-build
         inventory plus reviewedTree. Require reviewedTree to be a 40-character
         lowercase hexadecimal id, run
         `git cat-file -e "$reviewedTree^{tree}"`, require
         `git cat-file -t "$reviewedTree"` to equal `tree`, and prove the
         Rounds 1–7 evidence used
         `git diff --no-ext-diff --binary develop "$reviewedTree"`. Reject HEAD
         fallback or any change after the freeze. The deep-verify execution
         remains pending, not completed or READY, until this gate succeeds.

      2. Branch placement before commit:
         - Set `exactBranch="release/v${releaseVersion}"` and capture the current
           pre-commit HEAD. Before staging or committing, run
           `git branch --list release --format='%(refname:short)'`. A local
           `release` ref blocks the required nested ref.
         - If local `release` exists, prove it is merged or backed up and prefer
           `git branch -m release releases-tracking` when preservation is
           required. Never delete it without explicit approval, and halt if the
           preservation target already exists or cannot be proven safe.
         - Require the local branch named exactly `release/v${releaseVersion}`.
           If absent, create and switch to it from the captured pre-commit HEAD.
           If present, require it to point to that same HEAD before switching.
           If already current, require its tip to equal that HEAD. This is a
           local-only operation; do not push or perform any external mutation.
         - After branch placement, prove the final post-build inventory still
           materializes exactly as reviewedTree. Any checkout-induced or
           unrelated drift fails closed.

      3. Reject unrelated staged or unstaged source, then stage exactly the
         already-reviewed tree with `git read-tree "$reviewedTree"`. Record
         `stagedTree=$(git write-tree)` and require stagedTree to equal the
         pinned reviewedTree byte-for-byte before committing.
      4. Create the local Lore commit now, after R017/deep-verify and never
         before it. Set `verifiedSha` from the new 40-character lowercase HEAD,
         set `committedTree` from `verifiedSha^{tree}`, and require the committed
         tree to equal both stagedTree and reviewedTree byte-for-byte. Any
         mismatch fails closed.
      5. Permit no tracked source or index mutation after this equality proof.
         Do not run any source-mutating build, package, sync, or autofix command
         after the freeze. If another such command is required, halt and start a
         new acyclic pipeline run that produces a new `reviewedTree`.

      Mode payload:
      - `standard`: build the schemaVersion 1 artifact from the same pending
        deep-verify execution's findings, terminal outcomes, verdict, and gate
        evidence.
      - `docs-only-self-review` and `lite-deterministic`: build the same schema
        from the substituted review and record every reduced or not-run gate.
      - `converged-substitution`: first allow only an exact current-commit
        repository/release/verifiedSha selection. If no such artifact exists,
        build a new explicit `converged-substitution` artifact from the current
        equivalent evidence and not-run gates. Reusing old-SHA evidence or
        changing another artifact's mode is forbidden; never relabel it.

        For the exact-selection branch, create candidateSelectionFile with the
        exclusive regular mode-0600 contract, run:

          node "$artifactHelper" select \
            --project-root "$PWD" \
            --repository "$repository" \
            --release-version "$releaseVersion" \
            --verified-sha "$verifiedSha" >"$candidateSelectionFile"

        Parse it strictly as JSON data and require exact identity before defining
        artifactFile from `.path`. Only a verified no-matching-artifact result may
        choose the explicit write branch; malformed, ambiguous, or undecodable
        candidates fail closed instead of falling back.

      Safe input and writer projection:
      1. Create `artifactInputFile` and `writerProjectionFile` as exclusive
         regular, non-symlink, single-link files with mode 0600 in a private
         runtime directory. For a write branch, serialize JSON with top-level
         keys exactly `{artifact, body}`; reparse it and reject any other key.
      2. The artifact object must use repository, releaseVersion, verifiedSha,
         and executionMode already defined above. The safe body may summarize
         reviewed evidence but must exclude credentials, complete environment
         dumps, unredacted sensitive logs, and shell-interpolated finding text.
      3. Run the `artifact-contract.mjs write` command with the input file and
         direct stdout to the already-verified regular projection file:

          node "$artifactHelper" write \
            --project-root "$PWD" \
            --input "$artifactInputFile" >"$writerProjectionFile"

      4. Parse writerProjectionFile strictly as JSON data, require its artifact
         identity to match, extract its `.path` field without evaluation or
         interpolation, and only then define `artifactFile`. Require artifactFile
         to name a regular non-symlink file under the canonical session tree.
         In the exact-selection converged branch, parse the selector's `.path`
         the same way to define artifactFile; do not run the writer.

      Validation and selection:
      - Create validationProjectionFile and selectionFile with the same
        exclusive regular mode-0600 contract before redirecting output.
      - Run readback validation and exact selection only after artifactFile and
        verifiedSha are defined:

          node "$artifactHelper" validate \
            --file "$artifactFile" >"$validationProjectionFile"
          node "$artifactHelper" select \
            --project-root "$PWD" \
            --repository "$repository" \
            --release-version "$releaseVersion" \
            --verified-sha "$verifiedSha" >"$selectionFile"

      Parse both projections as JSON data. Require exact repository, version,
      SHA, executionMode, and selected path correlation with the local Lore
      commit. Missing, malformed, stale, wrong-mode, non-regular, ambiguous, or
      collision evidence must fail closed. Persist the validated selected path
      plus identity for release and post-release; conversation-only evidence is
      not completion.
    description: Commit the reviewed tree, then safely write, validate, and select exact evidence

  - name: release
    prompt: |
      Create and merge the reviewed release PR, then observe repository-owned release automation.

      1. Read back the immutable prepared result:
         - Parse the verification-artifact handoff as data and require current
           HEAD, its tree, repository, releaseVersion, and selected artifact to
           equal verifiedSha and the reviewed tree.
         - Derive `exactBranch="release/v${releaseVersion}"`, require the current
           branch to be that already-existing exact release branch, and require
           its local ref to point to verifiedSha. Do not create, rename, or
           switch branches in this phase.
         - Read `package.json`, `templates/manifest.json`, and `CHANGELOG.md`;
           require both manifests and the promoted changelog to match
           releaseVersion. Run `bash .github/scripts/verify-version-sync.sh`
           without changing files.
         - Require a clean worktree/index and prove verifiedSha will be the final
           PR head. Halt on mismatch. Do not change version, changelog, generated
           source, or release-note source, and create no new source commit after
           verification-artifact.
      2. Use only the reviewed release notes and PR body prepared from the
         verified tree; do not generate new source in this phase.
      3. Delegate the push/PR operation to mgr-gitnerd:
         - stage the reviewed PR body through `scripts/safe-command-payload.mjs`
           and use its body file instead of inline shell interpolation
         - push only the already-existing exact release branch at verifiedSha,
           open the PR to `develop`, query `headRefOid,statusCheckRollup`, and
           require `headRefOid` to equal verifiedSha
         - require every check at that exact head to pass; for
           `Deploy Test with Verdaccio`, select the latest matching check run by
           `startedAt` with a deterministic completed-time or database-ID tie-break
           so legitimate rerun history is allowed, then require that latest run
           to be non-skipped with terminal conclusion `SUCCESS`; absent, pending,
           skipped, neutral, or unsuccessful is a merge blocker, and merge is
           allowed only after direct readback
         - run `gh pr merge "$prNumber" --merge --match-head-commit "$verifiedSha"`
           using the directly read PR number; the expected-head guard is mandatory,
           and any concurrent head change must fail closed instead of merging
         - Merge without `--delete-branch`; remote merge mutation and branch
           cleanup are separate operations in linked or multi-worktree execution
         - perform merge/ref polling as a bounded readback under explicit
           `/bin/bash` with `set -euo pipefail`; use an exclusive temporary directory
           for JSON projections, allow at most 5 attempts, and sleep 2 seconds
           between attempts; never infer success from a display pipe or stale output
         - immediately read the PR back and require `state=MERGED`, a non-empty
           `mergedAt`, and an exact `mergeCommit.oid` before cleanup
         - only after that readback, delete the remote release ref with
           `gh api --method DELETE "repos/${repository}/git/refs/heads/${exactBranch}"`,
           then query it again and require that the remote ref is absent; an
           already-absent ref is idempotent only after the merged readback
         - Never switch, delete, or rename a local branch as part of remote cleanup.
      4. Preserve repository automation ownership:
         - The Auto Tag workflow owns annotated tag creation and provisional closure
           of scoped issues and the target milestone. The pipeline owns remote
           release-ref cleanup after authoritative merged-state readback.
         - The tag-triggered Release workflow owns npm, GitHub Packages, and GitHub Release publication plus live verification.
         - Do not create or push release tags manually.
         - Do not create the GitHub Release manually.
         - Do not directly close or relabel scoped issues or the milestone.
      5. Use the mutation barrier for recovery:
         - Every non-automated recovery mutation for an issue or milestone,
           including reopen or corrective relabeling, requires a fresh reviewed draft.
         - Repeat reviewed draft -> evidence review ->
           `node scripts/apply-triage-draft.mjs --draft <draft.json> --repo <owner/repo> --json`
           -> direct readback. Halt instead of using a direct mutation fallback.
      6. Read back the automated outcome:
         - Correlate the Auto Tag run to the merged PR head SHA and the Release
           run to the peeled tag commit.
         - After Auto Tag closes a milestone, verify by milestone number (not
           title-only search) and retry once before reporting missing.
         - Verify every scoped issue state, milestone counts, release-branch
           deletion, exact registry versions, GitHub Release, and safe live evidence.

      Adapt release mechanism to project:
      - This npm repository: PR + merge + repository automation + publication verification
      - Other repositories: first detect and respect their own tag/release automation contract
    description: "Merge the release PR, observe Auto Tag/Release automation, and verify external state"
    depends_on: verification-artifact

  - name: ci-check
    prompt: |
      Post-release CI verification.

      1. Check if .github/workflows/ has CI workflows
         If NOT: skip with "No CI configured. Skipping." and continue.
      2. If CI exists:
         - gh run list --limit 5
         - Wait for runs triggered by the new tag/push
         - If failures: diagnose and halt for a new reviewed fix-forward release
           pipeline; do not mutate the already-released verified source
      3. For npm projects: verify npm publish succeeded (npm view <pkg> version)
      4. Report final CI status.
    description: "Post-release CI verification and fix loop"
    depends_on: release

  - name: post-release-verification-artifact
    depends_on: ci-check
    prompt: |
      Re-verify the released merge and write new durable evidence before
      post-release Source B runs.

      - Resolve the exact released merge SHA from direct develop-merge, annotated
        tag-peel, Release, and automation evidence. Fast-forward a clean release
        worktree to that immutable commit and rerun the required post-merge
        verification on that exact tree.
      - Resolve `artifactHelper` from the active loaded `deep-verify` skill catalog
        entry's exact `SKILL.md`, using only its sibling
        `scripts/artifact-contract.mjs`. Require regular non-symlink assets; do
        not hardcode or search a source, installed, template, or plugin root.
      - Create a new schemaVersion 1 `standard` input with `verifiedSha` equal to
        the exact released merge SHA and evidence from the post-merge gates. Do
        not copy, relabel, or reuse the pre-merge artifact.
      - Run the `artifact-contract.mjs write` command, capture its JSON projection
        as data, then run `artifact-contract.mjs validate` on the returned file
        and `artifact-contract.mjs select` with the exact repository, released
        version, and merge SHA.
      - Require the selected projection and selected path to equal the new
        artifact and persist them for post-release Source B. Missing, malformed,
        stale, wrong-SHA, or collision evidence fails closed; do not convert it
        to zero unresolved findings or fall back to the pre-merge artifact.
    description: "Re-verify the immutable merge and select its new exact artifact"

  - name: post-release-followup
    skill: post-release-followup
    description: "Register follow-ups from this release as new issues"
    depends_on: post-release-verification-artifact
