name: Auto Tag on Release Merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Wait for required develop workflows
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MAX_ATTEMPTS: "36"
          SLEEP_SECONDS: "10"
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MERGE_SHA}" ] || [ "${MERGE_SHA}" = "null" ]; then
            echo "::error::Missing merge commit SHA for merged release PR"
            exit 1
          fi

          mapfile -t changed_files < <(git show -m --pretty="" --name-only "${MERGE_SHA}" | sed '/^$/d' | sort -u)
          required_workflows=("CI")

          for path in "${changed_files[@]}"; do
            if [[ "${path}" == "README.md" || "${path}" == "README_ko.md" || "${path}" == wiki/* || "${path}" == templates/* ]]; then
              required_workflows+=("Docs Sync")
              break
            fi
          done

          for path in "${changed_files[@]}"; do
            if [[ "${path}" == .codex/agents/* || "${path}" == .codex/skills/* || "${path}" == .agents/skills/* || "${path}" == .codex/rules/* || "${path}" == guides/* || "${path}" == wiki/* ]]; then
              required_workflows+=("Wiki Sync")
              break
            fi
          done

          echo "Required workflows: ${required_workflows[*]}"

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            runs_json=$(gh run list \
              --commit "${MERGE_SHA}" \
              --limit 100 \
              --json workflowName,status,conclusion,event,headSha)

            pending=0
            success_count=0

            for workflow in "${required_workflows[@]}"; do
              run_json=$(echo "${runs_json}" | jq -c --arg workflow "${workflow}" --arg sha "${MERGE_SHA}" '
                map(select(.workflowName == $workflow and .event == "push" and .headSha == $sha))
                | first
              ')

              if [ "${run_json}" = "null" ]; then
                echo "::notice::Waiting for workflow '${workflow}' on ${MERGE_SHA} to appear"
                pending=1
                continue
              fi

              status=$(echo "${run_json}" | jq -r '.status')
              conclusion=$(echo "${run_json}" | jq -r '.conclusion // ""')

              if [ "${status}" != "completed" ]; then
                echo "::notice::Workflow '${workflow}' is still ${status}"
                pending=1
                continue
              fi

              if [ "${conclusion}" != "success" ]; then
                echo "::error::Workflow '${workflow}' finished with conclusion '${conclusion}' on ${MERGE_SHA}"
                exit 1
              fi

              success_count=$((success_count + 1))
            done

            if [ "${pending}" -eq 0 ] && [ "${success_count}" -eq "${#required_workflows[@]}" ]; then
              echo "All required workflows succeeded for ${MERGE_SHA}"
              exit 0
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep "${SLEEP_SECONDS}"
            fi
          done

          echo "::error::Timed out waiting for required workflows on ${MERGE_SHA}"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted version: $TAG"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "${MERGE_SHA}" -m "Release $TAG"
          git push origin "$TAG"

      - name: Close linked issues
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          ISSUES=$(printf '%s\n' "$PR_BODY" \
            | grep -oiE '(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+([[:space:],;]+#[0-9]+)*' \
            | grep -oE '#[0-9]+' \
            | tr -d '#' \
            | sort -u)
          for ISSUE in $ISSUES; do
            echo "Closing issue #$ISSUE"
            gh issue close "$ISSUE" \
              -c "Closed by ${TAG} release (PR #${PR_NUMBER})" \
              --repo "$REPO" || echo "⚠ Failed to close #$ISSUE"
          done

      - name: Close milestone if all issues closed
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v ]] && milestone_title="$TAG" || milestone_title="v$TAG"

          milestone_number=$(gh api "repos/$REPO/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$milestone_title\") | .number")

          if [ -z "$milestone_number" ]; then
            echo "Milestone $milestone_title not found (open) — skip"
            exit 0
          fi

          open_issues=$(gh api "repos/$REPO/milestones/$milestone_number" --jq '.open_issues')

          if [ "$open_issues" -eq 0 ]; then
            gh api -X PATCH "repos/$REPO/milestones/$milestone_number" -f state=closed
            echo "Milestone $milestone_title closed (0 open issues)"
          else
            echo "Milestone $milestone_title has $open_issues open issues — skip close (will require manual close)"
          fi
