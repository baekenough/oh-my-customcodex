name: Deploy Test

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy-test:
    name: Deploy Test with Verdaccio
    if: >
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start Verdaccio
        run: |
          npm install -g verdaccio
          verdaccio &
          sleep 5

      - name: Configure npm for Verdaccio
        run: |
          npm config set registry http://localhost:4873/
          # Verdaccio's default config requires an authenticated user to publish.
          # Register a throwaway user via the adduser API and use its real token.
          TOKEN=$(curl -sf -X PUT \
            -H "Content-type: application/json" \
            -d '{"name":"test","password":"test1234"}' \
            http://localhost:4873/-/user/org.couchdb.user:test | jq -r '.token')
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          npm config set //localhost:4873/:_authToken "$TOKEN"

      - name: Publish to Verdaccio
        run: |
          npm publish --ignore-scripts --registry http://localhost:4873/

      - name: Test global install
        run: |
          npm install -g oh-my-customcodex --registry http://localhost:4873/

      - name: Test omcustomcodex --version
        run: omcustomcodex --version

      - name: Test omcustomcodex --help
        run: omcustomcodex --help

      - name: Test omcustomcodex init (dry run)
        run: |
          # Create a test directory
          mkdir -p /tmp/test-project
          cd /tmp/test-project

          # Test init command (use echo to simulate user input or --help for now)
          omcustomcodex init --help || echo "Init help displayed"

      - name: Cleanup
        if: always()
        run: |
          pkill -f verdaccio || true
