name: CI

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.normalize.outputs.full_ci }}
    steps:
      - name: Checkout full history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        if: ${{ always() }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/classify-ci-changes.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Normalize CI scope fail closed
        id: normalize
        if: ${{ always() }}
        continue-on-error: true
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          RAW_FULL_CI: ${{ steps.classify.outputs.full_ci }}
        run: |
          set -euo pipefail
          if [[ "$CHECKOUT_OUTCOME" == 'success' && \
                "$CLASSIFY_OUTCOME" == 'success' && \
                "$RAW_FULL_CI" == 'false' ]]; then
            echo 'full_ci=false' >> "$GITHUB_OUTPUT"
          else
            echo 'full_ci=true' >> "$GITHUB_OUTPUT"
          fi

  lockfile-sync:
    name: Lockfile Sync
    needs: [changes]
    runs-on: macos-latest
    steps:
      - name: Report documentation-only fast path
        if: ${{ needs.changes.outputs.full_ci == 'false' }}
        run: echo "Static Markdown-only change; lockfile verification is not required."

      - if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Verify lockfile consistency
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        run: |
          if ! bun install --frozen-lockfile 2>/dev/null; then
            echo "::error::bun.lock is out of sync with package.json files"
            echo ""
            echo "A workspace package.json was modified without updating bun.lock."
            echo "Fix: run 'bun install' locally and commit the updated bun.lock"
            exit 1
          fi

  lint:
    name: Lint
    needs: [changes, lockfile-sync]
    runs-on: macos-latest
    steps:
      - name: Report documentation-only fast path
        if: ${{ needs.changes.outputs.full_ci == 'false' }}
        run: echo "Static Markdown-only change; source lint is not required."

      - name: Checkout
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Bun
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        run: bun run lint

  test:
    name: Test
    needs: [changes, lockfile-sync]
    runs-on: macos-latest
    env:
      OMX_DEFAULT_FRONTIER_MODEL: test-frontier-model
      OMX_DEFAULT_SPARK_MODEL: test-spark-model
    steps:
      - name: Report documentation-only fast path
        if: ${{ needs.changes.outputs.full_ci == 'false' }}
        run: echo "Static Markdown-only change; the Bun test suite is not required."

      - name: Checkout
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Bun
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        run: bun install --frozen-lockfile

      - name: Run tests in stable batches
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        shell: bash
        run: |
          # NOTE:
          # `bun test --coverage` on the full imported harness tree is currently unstable
          # in GitHub Actions and is being terminated with SIGTERM (143) despite green
          # manual subsets. Directory-wide plain `bun test` runs also show the same
          # termination pattern, so execute the suite via explicit stable batches.
          # Revisit full-suite coverage aggregation when Bun provides a stable large-suite
          # path for this repo shape.

          run_bun_batch() {
            local label="$1"
            shift
            local log_file
            log_file=$(mktemp)

            echo "::group::${label}"
            set +e
            bun test "$@" 2>&1 | tee "$log_file"
            local test_exit=${PIPESTATUS[0]}
            set -e

            if [ "$test_exit" -ne 0 ]; then
              echo "::error::${label} failed with exit ${test_exit}"
              rm -f "$log_file"
              exit 1
            fi

            rm -f "$log_file"
            echo "::endgroup::"
          }

          # Sync / integration / e2e
          run_bun_batch "sync-integration-e2e" \
            tests/sync-upstream-release-issues.test.js \
            tests/integration/i18n.test.ts \
            tests/integration/init-flow.test.ts \
            tests/integration/codex-hooks-app-server.test.ts \
            tests/integration/omx-readiness.test.ts \
            tests/e2e/list.test.ts \
            tests/e2e/doctor.test.ts \
            tests/e2e/native-agent-omx.test.ts
          run_bun_batch "snapshot-readiness" tests/integration/snapshot-readiness.test.ts

          # CLI update / project / serve surface
          run_bun_batch "cli-update" tests/unit/cli/update.test.ts
          run_bun_batch "cli-projects" tests/unit/cli/projects.test.ts tests/unit/cli/projects-command.test.ts
          run_bun_batch "cli-serve" tests/unit/cli/serve.test.ts
          run_bun_batch "cli-serve-commands" tests/unit/cli/serve-commands.test.ts
          run_bun_batch "cli-web-commands" tests/unit/cli/web-commands.test.ts

          # CLI doctor / init / list / security surface
          # The linked-worktree snapshot regression invokes real Git and must not
          # share Bun's process with CLI suites that install global mocks.
          run_bun_batch "cli-init-snapshot" tests/unit/cli/init-snapshot.test.ts
          run_bun_batch "cli-doctor-init-list-security" \
            tests/unit/cli/doctor.test.ts \
            tests/unit/cli/doctor-checks.test.ts \
            tests/unit/cli/doctor-omx-readiness.test.ts \
            tests/unit/cli/doctor-omx.test.ts \
            tests/unit/cli/doctor-shell-advisor.test.ts \
            tests/unit/cli/doctor-updates.test.ts \
            tests/unit/cli/index.test.ts \
            tests/unit/cli/init.test.ts \
            tests/unit/cli/init-orchestration.test.ts \
            tests/unit/cli/list.test.ts \
            tests/unit/cli/list-managed.test.ts \
            tests/unit/cli/security.test.ts

          # Git-backed linked hook regressions invoke real child processes and must not
          # share Bun's process with suites that install process-wide mocks.
          run_bun_batch "native-linked-hooks" \
            tests/unit/core/codex-hooks-integration.test.ts \
            tests/unit/core/sync.test.ts

          # Core update / registry / template / hook surface
          run_bun_batch "core-update-registry-template-hooks" \
            tests/unit/core/codex-hooks.test.ts \
            tests/unit/core/hooks-scripts.test.ts \
            tests/unit/core/hooks-validation.test.ts \
            tests/unit/core/package-contract.test.ts \
            tests/unit/core/setup-hooks.test.ts \
            tests/unit/core/template-validation.test.ts \
            tests/unit/core/registry.test.ts \
            tests/unit/core/self-update.test.ts \
            tests/unit/core/self-update-integration.test.ts \
            tests/unit/core/updater.test.ts \
            tests/unit/core/entry-doc-update.test.ts

          # Core install / config / infra helpers
          # Keep the Git-backed project-root probe isolated from preflight-brew's
          # process-wide child_process mock in Bun's shared test runtime.
          run_bun_batch "codex-project-root" tests/unit/core/codex-project-root.test.ts
          run_bun_batch "omx-installer-boundary" tests/unit/core/omx-installer.test.ts
          run_bun_batch "managed-shell-artifact-contracts" \
            tests/unit/core/managed-shell-advisor-readiness.test.ts \
            tests/unit/core/shell-advisor-guidance.test.ts \
            tests/unit/core/deep-verify-artifact-contract.test.ts
          run_bun_batch "core-config-installer-utils" \
            tests/unit/core/agent-compiler.test.ts \
            tests/unit/core/config.test.ts \
            tests/unit/core/installer.test.ts \
            tests/unit/core/installer-rtk-codex.test.ts \
            tests/unit/core/lockfile.test.ts \
            tests/unit/core/mcp-config.test.ts \
            tests/unit/core/omx-readiness.test.ts \
            tests/unit/core/preflight.test.ts \
            tests/unit/core/preflight-brew.test.ts \
            tests/unit/core/provider.test.ts \
            tests/unit/core/doctor-framework.test.ts \
            tests/unit/utils/fs.test.ts \
            tests/unit/utils/logger.test.ts \
            tests/unit/i18n/index.test.ts

          # Native Web agent and workflow inventory guards
          run_bun_batch "serve-native-generation" \
            tests/unit/serve/agent-files.test.ts \
            tests/unit/serve/agent-generator.test.ts \
            tests/unit/serve/create-routes.integration.test.ts \
            tests/unit/serve/generation-provider.test.ts
          run_bun_batch "release-lifecycle-contracts" \
            tests/apply-triage-draft.test.js \
            tests/resolve-release-target.test.js \
            tests/safe-command-payload.test.js \
            tests/verify-release-contract.test.js \
            tests/unit/core/release-lifecycle-guidance.test.ts
          run_bun_batch "workflow-test-inventory" \
            tests/unit/core/ci-workflow.test.ts \
            tests/unit/core/release-workflow.test.ts

  package-contract:
    name: Packed Package Contract
    needs: [lockfile-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Node.js at the lowest supported floor
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20.17.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release candidate
        run: bun run build

      - name: Verify offline release contract
        id: offline_release_contract
        env:
          RELEASE_EVIDENCE_DIR: /tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-offline
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-release-contract.mjs \
            --mode offline \
            --version "$PACKAGE_VERSION" \
            --evidence-dir "$RELEASE_EVIDENCE_DIR"

      - name: Upload offline release evidence
        if: ${{ always() && steps.offline_release_contract.outputs.evidence_safe == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-release-evidence
          path: /tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-offline
          if-no-files-found: error
          retention-days: 7

  docs-validate:
    name: Validate Documentation
    needs: [lockfile-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run documentation validation
        run: bun run .github/scripts/validate-docs.ts --programmatic-only

  rust-test:
    name: Rust Tests
    needs: [changes]
    runs-on: macos-latest
    steps:
      - name: Report documentation-only fast path
        if: ${{ needs.changes.outputs.full_ci == 'false' }}
        run: echo "Static Markdown-only change; Rust tests are not required."

      - name: Checkout
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Rust
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust Cache
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: packages/ontology-rag
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Run Rust tests
        if: ${{ needs.changes.outputs.full_ci != 'false' }}
        working-directory: packages/ontology-rag
        run: cargo test --all

  version-sync:
    name: Version Sync
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Verify version sync
        run: bash .github/scripts/verify-version-sync.sh

  template-sync:
    name: Template Sync
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Verify .codex/ and templates/.claude/ are in sync
        run: bash .github/scripts/verify-template-sync.sh

      # Agents count sync
      - name: Verify agents sync
        run: |
          SRC_COUNT=$(ls .codex/agents/*.md 2>/dev/null | wc -l | tr -d ' ')
          TPL_COUNT=$(ls templates/.claude/agents/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "Source agents: $SRC_COUNT, Template agents: $TPL_COUNT"
          if [ "$SRC_COUNT" != "$TPL_COUNT" ]; then
            echo "::error::Agent count mismatch: source=$SRC_COUNT template=$TPL_COUNT"
            exit 1
          fi

      # Rules count sync
      - name: Verify rules sync
        run: |
          SRC_COUNT=$(ls .codex/rules/*.md 2>/dev/null | wc -l | tr -d ' ')
          TPL_COUNT=$(ls templates/.claude/rules/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "Source rules: $SRC_COUNT, Template rules: $TPL_COUNT"
          if [ "$SRC_COUNT" != "$TPL_COUNT" ]; then
            echo "::error::Rules count mismatch: source=$SRC_COUNT template=$TPL_COUNT"
            exit 1
          fi

      # Guides count sync
      - name: Verify guides sync
        run: |
          SRC_COUNT=$(find guides -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          TPL_COUNT=$(find templates/guides -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "Source guides: $SRC_COUNT, Template guides: $TPL_COUNT"
          if [ "$SRC_COUNT" != "$TPL_COUNT" ]; then
            echo "::error::Guides count mismatch: source=$SRC_COUNT template=$TPL_COUNT"
            exit 1
          fi
