name: Sync Upstream Release Issues

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Specific upstream release tag to sync
        required: false
        type: string
      dry_run:
        description: Report what would be created without opening issues
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - upstream-release

concurrency:
  group: upstream-release-issues
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Sync upstream release issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          UPSTREAM_REPOS: openai/codex,Yeachan-Heo/oh-my-codex,baekenough/oh-my-customcode
          CREATE_RELEASE_UPDATE_ISSUES: true
          UPSTREAM_RELEASE_WINDOW_DAYS: 14
          UPSTREAM_INCLUDE_PRERELEASES: false
          WORKFLOW_RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run }}
        run: |
          RELEASE_TAG="${WORKFLOW_RELEASE_TAG:-${DISPATCH_RELEASE_TAG:-}}"
          DRY_RUN="${WORKFLOW_DRY_RUN:-${DISPATCH_DRY_RUN:-false}}"
          export RELEASE_TAG DRY_RUN
          node scripts/sync-upstream-release-issues.js
