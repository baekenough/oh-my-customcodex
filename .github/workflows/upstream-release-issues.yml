name: Sync Upstream Release Issues

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Specific upstream release tag to sync
        required: false
        type: string
      dry_run:
        description: Report what would be created without opening issues
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - upstream-release

concurrency:
  group: upstream-release-issues
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'

      - name: Sync upstream release issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          UPSTREAM_REPO: baekenough/oh-my-customcode
          WORKFLOW_RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run }}
        run: |
          RELEASE_TAG="${WORKFLOW_RELEASE_TAG:-${DISPATCH_RELEASE_TAG:-}}"
          DRY_RUN="${WORKFLOW_DRY_RUN:-${DISPATCH_DRY_RUN:-false}}"
          export RELEASE_TAG DRY_RUN
          node scripts/sync-upstream-release-issues.js
