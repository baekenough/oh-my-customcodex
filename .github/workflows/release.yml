name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  gate:
    name: Gate Release On CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Wait for required commit workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          MAX_ATTEMPTS: "36"
          SLEEP_SECONDS: "10"
        shell: bash
        run: |
          set -euo pipefail

          tag_sha=$(git rev-list -n 1 "${TAG_NAME}")
          echo "Tag ${TAG_NAME} points to ${tag_sha}"

          mapfile -t changed_files < <(git show -m --pretty="" --name-only "${tag_sha}" | sed '/^$/d' | sort -u)
          required_workflows=("CI")

          for path in "${changed_files[@]}"; do
            if [[ "${path}" == "README.md" || "${path}" == "README_ko.md" || "${path}" == wiki/* || "${path}" == templates/* ]]; then
              required_workflows+=("Docs Sync")
              break
            fi
          done

          for path in "${changed_files[@]}"; do
            if [[ "${path}" == .codex/agents/* || "${path}" == .codex/skills/* || "${path}" == .agents/skills/* || "${path}" == .codex/rules/* || "${path}" == guides/* || "${path}" == wiki/* ]]; then
              required_workflows+=("Wiki Sync")
              break
            fi
          done

          echo "Required workflows: ${required_workflows[*]}"

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            runs_json=$(gh run list \
              --commit "${tag_sha}" \
              --limit 100 \
              --json workflowName,status,conclusion,event,headSha)

            pending=0
            success_count=0

            for workflow in "${required_workflows[@]}"; do
              run_json=$(echo "${runs_json}" | jq -c --arg workflow "${workflow}" --arg sha "${tag_sha}" '
                map(select(.workflowName == $workflow and .event == "push" and .headSha == $sha))
                | first
              ')

              if [ "${run_json}" = "null" ]; then
                echo "::notice::Waiting for workflow '${workflow}' on ${tag_sha} to appear"
                pending=1
                continue
              fi

              status=$(echo "${run_json}" | jq -r '.status')
              conclusion=$(echo "${run_json}" | jq -r '.conclusion // ""')

              if [ "${status}" != "completed" ]; then
                echo "::notice::Workflow '${workflow}' is still ${status}"
                pending=1
                continue
              fi

              if [ "${conclusion}" != "success" ]; then
                echo "::error::Workflow '${workflow}' finished with conclusion '${conclusion}' on ${tag_sha}"
                exit 1
              fi

              success_count=$((success_count + 1))
            done

            if [ "${pending}" -eq 0 ] && [ "${success_count}" -eq "${#required_workflows[@]}" ]; then
              echo "All required workflows succeeded for ${tag_sha}"
              exit 0
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep "${SLEEP_SECONDS}"
            fi
          done

          echo "::error::Timed out waiting for required workflows on ${tag_sha}"
          exit 1

  test:
    name: Test
    needs: [gate]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Node.js for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        run: bun run lint

      - name: Run tests in stable batches
        shell: bash
        run: |
          run_bun_batch() {
            local label="$1"
            shift
            local log_file
            log_file=$(mktemp)

            echo "::group::${label}"
            set +e
            bun test "$@" 2>&1 | tee "$log_file"
            local test_exit=${PIPESTATUS[0]}
            set -e

            if [ "$test_exit" -ne 0 ]; then
              if grep -qE "\\([Ff]ail\\)|[0-9]+ fail" "$log_file"; then
                echo "::error::${label} failed with exit ${test_exit}"
                rm -f "$log_file"
                exit 1
              fi

              if grep -qE "\\(pass\\)|[0-9]+ pass" "$log_file"; then
                echo "::warning::${label} exited with ${test_exit} but all observed tests passed (known Bun termination quirk). Continuing..."
              else
                echo "::error::${label} exited with ${test_exit} before any passing-test evidence was observed"
                rm -f "$log_file"
                exit 1
              fi
            fi

            rm -f "$log_file"
            echo "::endgroup::"
          }

          run_bun_batch "sync-integration-e2e" \
            tests/sync-upstream-release-issues.test.js \
            tests/integration/i18n.test.ts \
            tests/integration/init-flow.test.ts \
            tests/e2e/list.test.ts \
            tests/e2e/doctor.test.ts

          run_bun_batch "cli-update" tests/unit/cli/update.test.ts
          run_bun_batch "cli-projects" tests/unit/cli/projects.test.ts tests/unit/cli/projects-command.test.ts
          run_bun_batch "cli-serve" tests/unit/cli/serve.test.ts
          run_bun_batch "cli-serve-commands" tests/unit/cli/serve-commands.test.ts
          run_bun_batch "cli-web-commands" tests/unit/cli/web-commands.test.ts

          run_bun_batch "cli-doctor-init-list-security" \
            tests/unit/cli/doctor.test.ts \
            tests/unit/cli/doctor-checks.test.ts \
            tests/unit/cli/doctor-updates.test.ts \
            tests/unit/cli/init.test.ts \
            tests/unit/cli/init-snapshot.test.ts \
            tests/unit/cli/list.test.ts \
            tests/unit/cli/list-managed.test.ts \
            tests/unit/cli/security.test.ts

          run_bun_batch "core-update-registry-template-hooks" \
            tests/unit/core/hooks-scripts.test.ts \
            tests/unit/core/hooks-validation.test.ts \
            tests/unit/core/template-validation.test.ts \
            tests/unit/core/registry.test.ts \
            tests/unit/core/self-update.test.ts \
            tests/unit/core/self-update-integration.test.ts \
            tests/unit/core/updater.test.ts \
            tests/unit/core/entry-doc-update.test.ts \
            tests/unit/core/sync.test.ts

          run_bun_batch "core-config-installer-utils" \
            tests/unit/core/config.test.ts \
            tests/unit/core/installer.test.ts \
            tests/unit/core/installer-rtk-codex.test.ts \
            tests/unit/core/lockfile.test.ts \
            tests/unit/core/mcp-config.test.ts \
            tests/unit/core/preflight.test.ts \
            tests/unit/core/preflight-brew.test.ts \
            tests/unit/core/provider.test.ts \
            tests/unit/core/doctor-framework.test.ts \
            tests/unit/utils/fs.test.ts \
            tests/unit/utils/logger.test.ts \
            tests/unit/i18n/index.test.ts

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist/
            packages/*/dist/
            packages/*/build/
          retention-days: 1

  docs-validate:
    name: Validate Documentation
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run documentation validation
        run: bun run .github/scripts/validate-docs.ts --programmatic-only

  publish:
    name: Publish
    needs: [test, docs-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || { echo "::error::Missing dist/index.js"; exit 1; }
          echo "Build artifacts verified"

      - name: Verify version sync
        run: bash .github/scripts/verify-version-sync.sh

      # Check if version already exists on npm
      - name: Check npm version
        id: npm_check
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this version already exists on npm
          if npm view oh-my-customcodex@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already exists on npm, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Publish to npm (skip if already exists)
      - name: Publish to npm
        if: steps.npm_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.npm_check.outputs.version }}"
          MAX_PUBLISH_ATTEMPTS=3

          for ((attempt=1; attempt<=MAX_PUBLISH_ATTEMPTS; attempt++)); do
            log_file=$(mktemp)
            echo "::group::npm publish attempt ${attempt}/${MAX_PUBLISH_ATTEMPTS}"
            set +e
            npm publish --ignore-scripts --provenance --access public 2>&1 | tee "${log_file}"
            publish_exit=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "${publish_exit}" -eq 0 ]; then
              rm -f "${log_file}"
              exit 0
            fi

            # Check if failure is due to version already existing (race condition with local publish)
            if npm view oh-my-customcodex@${VERSION} version 2>/dev/null; then
              echo "::notice::Version ${VERSION} was published externally (race condition). Continuing."
              rm -f "${log_file}"
              exit 0
            fi

            if grep -qE 'TLOG_CREATE_ENTRY_ERROR|rekor\.sigstore\.dev|Invalid response body.*aborted' "${log_file}" && [ "${attempt}" -lt "${MAX_PUBLISH_ATTEMPTS}" ]; then
              echo "::warning::npm provenance/Rekor transient publish failure detected; retrying after 30 seconds."
              rm -f "${log_file}"
              sleep 30
              continue
            fi

            rm -f "${log_file}"
            exit "${publish_exit}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Re-configure for GitHub Packages
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@baekenough'

      # Check if version already exists on GitHub Packages
      - name: Check GitHub Packages version
        id: ghp_check
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # Check if this version already exists on GitHub Packages
          if npm view @baekenough/oh-my-customcodex@$VERSION version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already exists on GitHub Packages, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to GitHub Packages (skip if already exists)
      - name: Publish to GitHub Packages
        if: steps.ghp_check.outputs.exists == 'false'
        run: |
          # Update package name for GitHub Packages (scoped)
          jq '.name = "@baekenough/oh-my-customcodex" | .publishConfig = {"registry": "https://npm.pkg.github.com", "access": "public"}' package.json > package.json.tmp && mv package.json.tmp package.json
          npm publish --ignore-scripts 2>&1 || {
            EXIT_CODE=$?
            # Check if failure is due to version already existing (race condition with local publish)
            VERSION=${GITHUB_REF#refs/tags/v}
            if npm view @baekenough/oh-my-customcodex@$VERSION version --registry=https://npm.pkg.github.com 2>/dev/null; then
              echo "::notice::Version $VERSION was published externally (race condition). Continuing."
            else
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Restore package.json (only if we modified it)
      - name: Restore package.json
        if: steps.ghp_check.outputs.exists == 'false'
        run: git checkout package.json

      # Extract changelog for this version (with graceful fallback)
      - name: Extract Release Notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check for CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found. Release PRs must promote changelog entries before tagging."
            exit 1
          fi

          # Extract changelog section for this version
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::No changelog entry found for version ${VERSION}."
            echo "::error::Add a '## [${VERSION}] - YYYY-MM-DD' section to CHANGELOG.md before creating the release tag."
            exit 1
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "::notice::Found changelog entry for v${VERSION}"
          fi

      # Create GitHub Release with changelog or auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ---

            ### Installation

            ```bash
            # npm
            npm install oh-my-customcodex@${{ steps.changelog.outputs.version }}

            # or use npx
            npx oh-my-customcodex@${{ steps.changelog.outputs.version }} init
            ```

            ### Links
            - [npm package](https://www.npmjs.com/package/oh-my-customcodex/v/${{ steps.changelog.outputs.version }})
            - [GitHub Package](https://github.com/baekenough/oh-my-customcodex/pkgs/npm/oh-my-customcodex)
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify Release
    needs: [publish]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify npm publish
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for i in 1 2 3; do
            PUBLISHED=$(npm view oh-my-customcodex@${VERSION} version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✓ npm: oh-my-customcodex@${VERSION} confirmed"
              exit 0
            fi
            echo "Attempt $i: not found yet, waiting 30s..."
            sleep 30
          done
          echo "::error::npm package not found after 3 attempts: oh-my-customcodex@${VERSION}"
          exit 1

      - name: Verify GitHub Packages publish
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for i in 1 2 3; do
            PUBLISHED=$(npm view @baekenough/oh-my-customcodex@${VERSION} version \
              --registry=https://npm.pkg.github.com 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✓ GitHub Packages: @baekenough/oh-my-customcodex@${VERSION} confirmed"
              exit 0
            fi
            echo "Attempt $i: not found yet, waiting 30s..."
            sleep 30
          done
          echo "::warning::GitHub Package not found after 3 attempts (eventual consistency — package will appear later)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/v${VERSION} \
            --jq '.tag_name' 2>/dev/null || true)
          if [ "$RELEASE" = "v${VERSION}" ]; then
            echo "✓ GitHub Release: v${VERSION} confirmed"
          else
            echo "::error::GitHub Release not found for v${VERSION}"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Release Verification: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          NPM=$(npm view oh-my-customcodex@${VERSION} version 2>/dev/null || echo "NOT FOUND")
          GHP=$(npm view @baekenough/oh-my-customcodex@${VERSION} version \
            --registry=https://npm.pkg.github.com 2>/dev/null || echo "NOT FOUND")
          GHR=$(gh api repos/${{ github.repository }}/releases/tags/v${VERSION} \
            --jq '.tag_name' 2>/dev/null || echo "NOT FOUND")
          echo "| npm | ${NPM} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Packages | ${GHP} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${GHR} |" >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
