name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  gate:
    name: Gate Release On CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Wait for required commit workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          MAX_ATTEMPTS: "36"
          SLEEP_SECONDS: "10"
        shell: bash
        run: |
          set -euo pipefail

          tag_sha=$(git rev-list -n 1 "${TAG_NAME}")
          echo "Tag ${TAG_NAME} points to ${tag_sha}"

          mapfile -t changed_files < <(git show -m --pretty="" --name-only "${tag_sha}" | sed '/^$/d' | sort -u)
          required_workflows=("CI")

          for path in "${changed_files[@]}"; do
            if [[ "${path}" == "README.md" || "${path}" == "README_ko.md" || "${path}" == wiki/* || "${path}" == templates/* ]]; then
              required_workflows+=("Docs Sync")
              break
            fi
          done

          for path in "${changed_files[@]}"; do
            if [[ "${path}" == .codex/agents/* || "${path}" == .codex/skills/* || "${path}" == .agents/skills/* || "${path}" == .codex/rules/* || "${path}" == guides/* || "${path}" == wiki/* ]]; then
              required_workflows+=("Wiki Sync")
              break
            fi
          done

          echo "Required workflows: ${required_workflows[*]}"

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            runs_json=$(gh run list \
              --commit "${tag_sha}" \
              --limit 100 \
              --json workflowName,status,conclusion,event,headSha)

            pending=0
            success_count=0

            for workflow in "${required_workflows[@]}"; do
              run_json=$(echo "${runs_json}" | jq -c --arg workflow "${workflow}" --arg sha "${tag_sha}" '
                map(select(.workflowName == $workflow and .event == "push" and .headSha == $sha))
                | first
              ')

              if [ "${run_json}" = "null" ]; then
                echo "::notice::Waiting for workflow '${workflow}' on ${tag_sha} to appear"
                pending=1
                continue
              fi

              status=$(echo "${run_json}" | jq -r '.status')
              conclusion=$(echo "${run_json}" | jq -r '.conclusion // ""')

              if [ "${status}" != "completed" ]; then
                echo "::notice::Workflow '${workflow}' is still ${status}"
                pending=1
                continue
              fi

              if [ "${conclusion}" != "success" ]; then
                echo "::error::Workflow '${workflow}' finished with conclusion '${conclusion}' on ${tag_sha}"
                exit 1
              fi

              success_count=$((success_count + 1))
            done

            if [ "${pending}" -eq 0 ] && [ "${success_count}" -eq "${#required_workflows[@]}" ]; then
              echo "All required workflows succeeded for ${tag_sha}"
              exit 0
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep "${SLEEP_SECONDS}"
            fi
          done

          echo "::error::Timed out waiting for required workflows on ${tag_sha}"
          exit 1

  test:
    name: Test
    needs: [gate]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      OMX_DEFAULT_FRONTIER_MODEL: test-frontier-model
      OMX_DEFAULT_SPARK_MODEL: test-spark-model
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Node.js for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20.17.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        run: bun run lint

      - name: Run tests in stable batches
        shell: bash
        run: |
          run_bun_batch() {
            local label="$1"
            shift
            local log_file
            log_file=$(mktemp)

            echo "::group::${label}"
            set +e
            bun test "$@" 2>&1 | tee "$log_file"
            local test_exit=${PIPESTATUS[0]}
            set -e

            if [ "$test_exit" -ne 0 ]; then
              echo "::error::${label} failed with exit ${test_exit}"
              rm -f "$log_file"
              exit 1
            fi

            rm -f "$log_file"
            echo "::endgroup::"
          }

          run_bun_batch "sync-integration-e2e" \
            tests/sync-upstream-release-issues.test.js \
            tests/integration/i18n.test.ts \
            tests/integration/init-flow.test.ts \
            tests/integration/codex-hooks-app-server.test.ts \
            tests/integration/omx-readiness.test.ts \
            tests/e2e/list.test.ts \
            tests/e2e/doctor.test.ts \
            tests/e2e/native-agent-omx.test.ts
          run_bun_batch "snapshot-readiness" tests/integration/snapshot-readiness.test.ts

          run_bun_batch "cli-update" tests/unit/cli/update.test.ts
          run_bun_batch "cli-projects" tests/unit/cli/projects.test.ts tests/unit/cli/projects-command.test.ts
          run_bun_batch "cli-serve" tests/unit/cli/serve.test.ts
          run_bun_batch "cli-serve-commands" tests/unit/cli/serve-commands.test.ts
          run_bun_batch "cli-web-commands" tests/unit/cli/web-commands.test.ts

          # The linked-worktree snapshot regression invokes real Git and must not
          # share Bun's process with CLI suites that install global mocks.
          run_bun_batch "cli-init-snapshot" tests/unit/cli/init-snapshot.test.ts
          run_bun_batch "cli-doctor-init-list-security" \
            tests/unit/cli/doctor.test.ts \
            tests/unit/cli/doctor-checks.test.ts \
            tests/unit/cli/doctor-omx-readiness.test.ts \
            tests/unit/cli/doctor-omx.test.ts \
            tests/unit/cli/doctor-updates.test.ts \
            tests/unit/cli/init.test.ts \
            tests/unit/cli/init-orchestration.test.ts \
            tests/unit/cli/list.test.ts \
            tests/unit/cli/list-managed.test.ts \
            tests/unit/cli/security.test.ts

          # Git-backed linked hook regressions invoke real child processes and must not
          # share Bun's process with suites that install process-wide mocks.
          run_bun_batch "native-linked-hooks" \
            tests/unit/core/codex-hooks-integration.test.ts \
            tests/unit/core/sync.test.ts

          run_bun_batch "core-update-registry-template-hooks" \
            tests/unit/core/codex-hooks.test.ts \
            tests/unit/core/hooks-scripts.test.ts \
            tests/unit/core/hooks-validation.test.ts \
            tests/unit/core/package-contract.test.ts \
            tests/unit/core/setup-hooks.test.ts \
            tests/unit/core/template-validation.test.ts \
            tests/unit/core/registry.test.ts \
            tests/unit/core/self-update.test.ts \
            tests/unit/core/self-update-integration.test.ts \
            tests/unit/core/updater.test.ts \
            tests/unit/core/entry-doc-update.test.ts

          # Keep the Git-backed project-root probe isolated from preflight-brew's
          # process-wide child_process mock in Bun's shared test runtime.
          run_bun_batch "codex-project-root" tests/unit/core/codex-project-root.test.ts
          run_bun_batch "omx-installer-boundary" tests/unit/core/omx-installer.test.ts
          run_bun_batch "core-config-installer-utils" \
            tests/unit/core/agent-compiler.test.ts \
            tests/unit/core/config.test.ts \
            tests/unit/core/installer.test.ts \
            tests/unit/core/installer-rtk-codex.test.ts \
            tests/unit/core/lockfile.test.ts \
            tests/unit/core/mcp-config.test.ts \
            tests/unit/core/omx-readiness.test.ts \
            tests/unit/core/preflight.test.ts \
            tests/unit/core/preflight-brew.test.ts \
            tests/unit/core/provider.test.ts \
            tests/unit/core/doctor-framework.test.ts \
            tests/unit/utils/fs.test.ts \
            tests/unit/utils/logger.test.ts \
            tests/unit/i18n/index.test.ts

          run_bun_batch "serve-native-generation" \
            tests/unit/serve/agent-files.test.ts \
            tests/unit/serve/agent-generator.test.ts \
            tests/unit/serve/create-routes.integration.test.ts \
            tests/unit/serve/generation-provider.test.ts
          run_bun_batch "release-lifecycle-contracts" \
            tests/apply-triage-draft.test.js \
            tests/resolve-release-target.test.js \
            tests/safe-command-payload.test.js \
            tests/verify-release-contract.test.js \
            tests/unit/core/release-lifecycle-guidance.test.ts
          run_bun_batch "workflow-test-inventory" \
            tests/unit/core/ci-workflow.test.ts \
            tests/unit/core/release-workflow.test.ts

      - name: Build
        run: bun run build

      - name: Verify offline release contract
        id: offline_verify
        env:
          RELEASE_EVIDENCE_DIR: /tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-offline
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-release-contract.mjs \
            --mode offline \
            --version "$PACKAGE_VERSION" \
            --evidence-dir "$RELEASE_EVIDENCE_DIR"

      - name: Upload offline release evidence
        if: always() && steps.offline_verify.outputs.evidence_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: offline-release-evidence
          path: /tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-offline
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist/
            packages/*/dist/
            packages/*/build/
          retention-days: 1

  docs-validate:
    name: Validate Documentation
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run documentation validation
        run: bun run .github/scripts/validate-docs.ts --programmatic-only

  publish:
    name: Publish
    needs: [test, docs-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || { echo "::error::Missing dist/index.js"; exit 1; }
          echo "Build artifacts verified"

      - name: Verify version sync
        run: bash .github/scripts/verify-version-sync.sh

      # Check if version already exists on npm
      - name: Check npm version
        id: npm_check
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this version already exists on npm
          if npm view oh-my-customcodex@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already exists on npm, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Publish to npm (skip if already exists)
      - name: Publish to npm
        if: steps.npm_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.npm_check.outputs.version }}"
          MAX_PUBLISH_ATTEMPTS=3

          for ((attempt=1; attempt<=MAX_PUBLISH_ATTEMPTS; attempt++)); do
            log_file=$(mktemp)
            echo "::group::npm publish attempt ${attempt}/${MAX_PUBLISH_ATTEMPTS}"
            set +e
            npm publish --ignore-scripts --provenance --access public 2>&1 | tee "${log_file}"
            publish_exit=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "${publish_exit}" -eq 0 ]; then
              rm -f "${log_file}"
              exit 0
            fi

            # Check if failure is due to version already existing (race condition with local publish)
            if npm view oh-my-customcodex@${VERSION} version 2>/dev/null; then
              echo "::notice::Version ${VERSION} was published externally (race condition). Continuing."
              rm -f "${log_file}"
              exit 0
            fi

            if grep -qE 'TLOG_CREATE_ENTRY_ERROR|rekor\.sigstore\.dev|Invalid response body.*aborted' "${log_file}" && [ "${attempt}" -lt "${MAX_PUBLISH_ATTEMPTS}" ]; then
              echo "::warning::npm provenance/Rekor transient publish failure detected; retrying after 30 seconds."
              rm -f "${log_file}"
              sleep 30
              continue
            fi

            rm -f "${log_file}"
            exit "${publish_exit}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Re-configure for GitHub Packages
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@baekenough'

      # Check if version already exists on GitHub Packages
      - name: Check GitHub Packages version
        id: ghp_check
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # Check if this version already exists on GitHub Packages
          if npm view @baekenough/oh-my-customcodex@$VERSION version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION already exists on GitHub Packages, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to GitHub Packages (skip if already exists)
      - name: Publish to GitHub Packages
        if: steps.ghp_check.outputs.exists == 'false'
        run: |
          # Update package name for GitHub Packages (scoped)
          jq '.name = "@baekenough/oh-my-customcodex" | .publishConfig = {"registry": "https://npm.pkg.github.com", "access": "public"}' package.json > package.json.tmp && mv package.json.tmp package.json
          npm publish --ignore-scripts 2>&1 || {
            EXIT_CODE=$?
            # Check if failure is due to version already existing (race condition with local publish)
            VERSION=${GITHUB_REF#refs/tags/v}
            if npm view @baekenough/oh-my-customcodex@$VERSION version --registry=https://npm.pkg.github.com 2>/dev/null; then
              echo "::notice::Version $VERSION was published externally (race condition). Continuing."
            else
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Restore package.json (only if we modified it)
      - name: Restore package.json
        if: steps.ghp_check.outputs.exists == 'false'
        run: git checkout package.json

      # Extract changelog for this version (with graceful fallback)
      - name: Extract Release Notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check for CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found. Release PRs must promote changelog entries before tagging."
            exit 1
          fi

          # Extract changelog section for this version
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::No changelog entry found for version ${VERSION}."
            echo "::error::Add a '## [${VERSION}] - YYYY-MM-DD' section to CHANGELOG.md before creating the release tag."
            exit 1
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "::notice::Found changelog entry for v${VERSION}"
          fi

      # Create GitHub Release with changelog or auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ---

            ### Installation

            ```bash
            # npm
            npm install oh-my-customcodex@${{ steps.changelog.outputs.version }}

            # or use npx
            npx oh-my-customcodex@${{ steps.changelog.outputs.version }} init
            ```

            ### Links
            - [npm package](https://www.npmjs.com/package/oh-my-customcodex/v/${{ steps.changelog.outputs.version }})
            - [GitHub Package](https://github.com/baekenough/oh-my-customcodex/pkgs/npm/oh-my-customcodex)
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify Release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js at the supported floor
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20.17.0'

      - name: Download offline release evidence
        uses: actions/download-artifact@v8
        with:
          name: offline-release-evidence
          path: ${{ runner.temp }}/release-evidence/offline-prior

      - name: Validate reusable offline evidence
        run: |
          EVIDENCE_ROOT="${{ runner.temp }}/release-evidence/offline-prior"
          MANIFEST="${EVIDENCE_ROOT}/manifest.json"
          test -f "$MANIFEST"
          (cd "$EVIDENCE_ROOT" && sha256sum --check SHA256SUMS)
          jq -e \
            --arg source_sha "${{ github.sha }}" \
            '.mode == "offline" and .overall == "PASS" and .evidence_safe == true and .sourceSha == $source_sha' \
            "$MANIFEST" >/dev/null

      - name: Prefetch trusted release inputs without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          EXPECTED_SOURCE_SHA="${{ github.sha }}"
          PEELED_SOURCE_SHA=$(git rev-parse "v${VERSION}^{commit}")
          test "${PEELED_SOURCE_SHA}" = "${EXPECTED_SOURCE_SHA}"

          INPUT_ROOT="/tmp/omcustomcodex-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-input"
          test ! -e "${INPUT_ROOT}"
          install -d -m 0700 "${INPUT_ROOT}"
          npmrc_file="${RUNNER_TEMP}/omcustomcodex-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-auth.npmrc"
          umask 077
          printf '%s\n' \
            'ignore-scripts=true' \
            '@baekenough:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >"${npmrc_file}"
          chmod 0600 "${npmrc_file}"
          cleanup_auth() { rm -f "${npmrc_file}"; }
          trap cleanup_auth EXIT
          export npm_config_userconfig="${npmrc_file}"
          export npm_config_ignore_scripts=true

          retry_to_file() {
            local destination=$1
            shift
            for attempt in 1 2 3; do
              if "$@" >"${destination}"; then return 0; fi
              if [ "${attempt}" -lt 3 ]; then sleep 20; fi
            done
            return 1
          }
          pack_exact() {
            local output=$1
            shift
            local download="${INPUT_ROOT}/download-$(basename "${output}" .tgz)"
            for attempt in 1 2 3; do
              rm -rf "${download}"
              install -d -m 0700 "${download}"
              if npm pack --ignore-scripts --pack-destination "${download}" "$@"; then
                shopt -s nullglob
                local candidates=("${download}"/*.tgz)
                shopt -u nullglob
                if [ "${#candidates[@]}" -eq 1 ]; then
                  mv -- "${candidates[0]}" "${output}"
                  rm -rf "${download}"
                  return 0
                fi
              fi
              if [ "${attempt}" -lt 3 ]; then sleep 20; fi
            done
            return 1
          }

          retry_to_file "${INPUT_ROOT}/npm.json" \
            npm view "oh-my-customcodex@${VERSION}" name version dist.integrity dist.tarball --json
          retry_to_file "${INPUT_ROOT}/github-packages.json" \
            npm view "@baekenough/oh-my-customcodex@${VERSION}" name version dist.integrity dist.tarball \
              --json --registry=https://npm.pkg.github.com
          retry_to_file "${INPUT_ROOT}/github-release.json" \
            gh release view "v${VERSION}" --repo "${{ github.repository }}" --json tagName,url
          pack_exact "${INPUT_ROOT}/unscoped.tgz" "oh-my-customcodex@${VERSION}"
          pack_exact "${INPUT_ROOT}/scoped.tgz" \
            "@baekenough/oh-my-customcodex@${VERSION}" --registry=https://npm.pkg.github.com

          npm_sha=$(sha256sum "${INPUT_ROOT}/unscoped.tgz" | cut -d ' ' -f 1)
          ghp_sha=$(sha256sum "${INPUT_ROOT}/scoped.tgz" | cut -d ' ' -f 1)
          jq -n \
            --arg version "${VERSION}" \
            --arg tag "v${VERSION}" \
            --arg source_sha "${EXPECTED_SOURCE_SHA}" \
            --arg repository "${{ github.repository }}" \
            --arg npm_sha "${npm_sha}" \
            --arg ghp_sha "${ghp_sha}" \
            --slurpfile npm "${INPUT_ROOT}/npm.json" \
            --slurpfile ghp "${INPUT_ROOT}/github-packages.json" \
            --slurpfile release "${INPUT_ROOT}/github-release.json" \
            '{
              schemaVersion: 1,
              version: $version,
              tag: $tag,
              expectedSourceSha: $source_sha,
              repository: $repository,
              registries: {npm: $npm[0], githubPackages: $ghp[0]},
              githubRelease: $release[0],
              artifacts: {
                unscoped: {file: "unscoped.tgz", sha256: $npm_sha},
                scoped: {file: "scoped.tgz", sha256: $ghp_sha}
              }
            }' >"${INPUT_ROOT}/external-state.json"
          rm -f \
            "${INPUT_ROOT}/npm.json" \
            "${INPUT_ROOT}/github-packages.json" \
            "${INPUT_ROOT}/github-release.json"
          chmod 0600 "${INPUT_ROOT}"/*
          cleanup_auth
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN npm_config_userconfig
          trap - EXIT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert checkout credential boundary
        shell: bash
        run: |
          set -euo pipefail
          credential_pattern='^(http\..*\.extraheader|credential(\..*)?\.(helper|username|password|token))$'
          if git config --local --get-regexp "${credential_pattern}" >/dev/null 2>&1; then
            echo "::error::checkout-local Git credential configuration remained before lifecycle execution"
            exit 1
          fi
          isolated_git_home="/tmp/omcustomcodex-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-git-home"
          test ! -e "${isolated_git_home}"
          install -d -m 0700 "${isolated_git_home}"
          if HOME="${isolated_git_home}" git config --global --get-regexp "${credential_pattern}" >/dev/null 2>&1; then
            echo "::error::isolated lifecycle HOME contains Git credential configuration"
            exit 1
          fi
          rmdir "${isolated_git_home}"

      - name: Run canonical live verifier
        id: live_verify
        shell: bash
        run: |
          set -uo pipefail
          VERSION=${GITHUB_REF#refs/tags/v}
          workflow_output=${GITHUB_OUTPUT}
          unset GITHUB_OUTPUT GITHUB_ENV GITHUB_PATH GITHUB_STATE GITHUB_STEP_SUMMARY
          shopt -s nocasematch
          while IFS= read -r name; do
            case "${name}" in
              GH_TOKEN|GITHUB_TOKEN|NODE_AUTH_TOKEN|NPM_TOKEN|ACTIONS_*_TOKEN|GH_*_TOKEN|GITHUB_*_TOKEN|NPM_CONFIG_*AUTH*|NPM_CONFIG_*TOKEN*|npm_config_*auth*|npm_config_*token*|NODE_OPTIONS|npm_config_node_options|NPM_CONFIG_NODE_OPTIONS|BUN_OPTIONS|NODE_PATH|npm_config_node_path|NPM_CONFIG_NODE_PATH|npm_config_userconfig|NPM_CONFIG_USERCONFIG|npm_config_globalconfig|NPM_CONFIG_GLOBALCONFIG|npm_config_script_shell|NPM_CONFIG_SCRIPT_SHELL|npm_config_registry|NPM_CONFIG_REGISTRY|GH_CONFIG_DIR|GITHUB_WORKSPACE|RUNNER_TEMP|RUNNER_TOOL_CACHE|GIT_CONFIG_PARAMETERS|GIT_CONFIG_COUNT|GIT_CONFIG_KEY_*|GIT_CONFIG_VALUE_*|GIT_CONFIG_GLOBAL|GIT_CONFIG_SYSTEM|GIT_CONFIG_NOSYSTEM|GIT_CEILING_DIRECTORIES|GIT_ASKPASS|SSH_ASKPASS|GIT_SSH|GIT_SSH_COMMAND)
                unset "${name}"
                ;;
            esac
          done < <(compgen -e)
          shopt -u nocasematch
          set +e
          verifier_json=$(node scripts/verify-release-contract.mjs \
            --mode live \
            --version "$VERSION" \
            --tag "v${VERSION}" \
            --expected-source-sha "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --live-input-dir "/tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-input" \
            --evidence-dir "/tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-live")
          verifier_exit=$?
          set -e
          printf '%s\n' "${verifier_json}"
          overall=FAIL
          evidence_safe=false
          if printf '%s\n' "${verifier_json}" | jq -e \
            'has("overall") and has("evidence_safe")' >/dev/null; then
            overall=$(printf '%s\n' "${verifier_json}" | jq -r '.overall')
            evidence_safe=$(printf '%s\n' "${verifier_json}" | jq -r '.evidence_safe')
          fi
          {
            echo "exit_code=${verifier_exit}"
            echo "overall=${overall}"
            echo "evidence_safe=${evidence_safe}"
          } >>"${workflow_output}"
          if [ "${verifier_exit}" -ne 0 ]; then
            echo "::error::release verification failed; unsafe evidence suppressed by the verifier"
          fi
          exit 0
      - name: Upload live release evidence
        if: always() && steps.live_verify.outputs.evidence_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: live-release-evidence
          path: /tmp/omcustomcodex-release-${{ github.run_id }}-${{ github.run_attempt }}-live
          if-no-files-found: error
          retention-days: 30

      - name: Enforce live verification result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.live_verify.outputs.exit_code }}" != "0" ] || [ "${{ steps.live_verify.outputs.overall }}" != "PASS" ]; then
            echo "::error::Canonical live release verification failed"
            exit 1
          fi
          echo "## Release verification: PASS" >>"${GITHUB_STEP_SUMMARY}"
