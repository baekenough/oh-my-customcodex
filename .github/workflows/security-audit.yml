name: Security Audit

on:
  # Weekly audit every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Also run on PRs to catch new vulnerabilities
  pull_request:
    branches:
      - develop
      - 'release/**'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit --audit-level=high

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Security vulnerabilities detected. Please update dependencies."
          echo "Run 'bun audit --audit-level=high' locally to see details."
