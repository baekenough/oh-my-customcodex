name: Wiki Sync

on:
  push:
    branches:
      - develop
    paths:
      - '.codex/agents/**'
      - '.codex/skills/**'
      - '.agents/skills/**'
      - '.codex/rules/**'
      - 'guides/**'
      - 'wiki/**'
  pull_request:
    branches:
      - develop
    paths:
      - '.codex/agents/**'
      - '.codex/skills/**'
      - '.agents/skills/**'
      - '.codex/rules/**'
      - 'guides/**'
      - 'wiki/**'

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wiki-staleness-check:
    name: Wiki Staleness Check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Check wiki directory exists
        run: |
          if [ ! -d "wiki" ]; then
            echo "::error::wiki/ directory does not exist"
            echo ""
            echo "The wiki/ directory is required for this project."
            echo "Fix: run '/omcustomcodex:wiki' to generate the initial wiki"
            exit 1
          fi

      - name: Check for missing wiki pages
        run: bash .github/scripts/verify-wiki-sync.sh

      - name: Report results
        if: success()
        run: |
          SKILLS_ROOT=".codex/skills"
          if [ -d ".agents/skills" ]; then
            SKILLS_ROOT=".agents/skills"
          fi
          TOTAL_AGENTS=$(ls .codex/agents/*.md 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_SKILLS=$(find "$SKILLS_ROOT" -name "SKILL.md" 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_RULES=$(ls .codex/rules/*.md 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_GUIDES=$(find guides -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          TOTAL_WIKI=$(find wiki -name "*.md" ! -name "index.md" ! -name "log.md" 2>/dev/null | wc -l | tr -d ' ')

          echo "Source entities: agents=$TOTAL_AGENTS skills=$TOTAL_SKILLS rules=$TOTAL_RULES guides=$TOTAL_GUIDES"
          echo "Wiki pages: $TOTAL_WIKI"
          echo "All wiki pages present — sync OK"
