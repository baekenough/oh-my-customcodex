name: Issue Triage Dispatch

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Checkout triage helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Ensure triaged label exists
        run: |
          set -euo pipefail

          read_repository_labels() {
            gh api --paginate \
              "repos/${GH_REPO}/labels?per_page=100" \
              --jq '.[].name'
          }

          if ! labels=$(read_repository_labels); then
            echo "::error::Could not read repository labels." >&2
            exit 1
          fi

          if grep -Fqx 'triaged' <<< "$labels"; then
            echo "Repository label 'triaged' already exists."
            exit 0
          fi

          if gh label create triaged \
               --color "C5DEF5" \
               --description "Issue acknowledged by triage dispatch" \
               --repo "$GH_REPO"; then
            create_status=0
          else
            create_status=$?
          fi

          if ! labels=$(read_repository_labels); then
            echo "::error::Could not confirm repository labels after create." >&2
            exit 1
          fi

          if grep -Fqx 'triaged' <<< "$labels"; then
            if (( create_status == 0 )); then
              echo "Created repository label 'triaged'."
            else
              echo "Repository label 'triaged' was created concurrently."
            fi
            exit 0
          fi

          if (( create_status == 0 )); then
            echo "::error::Label creation returned success, but 'triaged' was absent on readback." >&2
          else
            echo "::error::Could not create repository label 'triaged' (exit ${create_status})." >&2
          fi
          exit 1

      - name: Record issue type
        run: |
          set -euo pipefail
          # Real triage is performed by the in-session professor-triage skill.
          # This workflow only acknowledges new or labeled issues; no external CLI is required.
          echo "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          echo "Triage acknowledgment will be posted only when the issue is not already triaged."

      - name: Post triage acknowledgment
        run: bash .github/scripts/triage-dispatch.sh
